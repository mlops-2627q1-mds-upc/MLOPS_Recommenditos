# The pipeline. `dvc repro` runs it; commit the resulting dvc.lock.
#
# One module per stage (EDN-28), so a stage's `deps` name exactly the code that
# stage runs and a change reruns the minimum. Every stage reads its inputs and
# writes a schema-valid output against `recommenditos/schema.py`, which is the
# contract the stage tickets code against instead of against each other.
#
# Hand-edited on purpose: `dvc stage add` rewrites the whole file, re-indents
# every list and line-wraps long commands, which would destroy these comments.
#
# `params.yaml` is a deliberate deviation from the course demo, which keeps the
# same settings in `config.py` (EDN-30). Because they are parameters, a change
# to one reruns the stages that read it and `dvc exp` can sweep them.

stages:
  # ----------------------------------------------------------------------
  # download: make the raw snapshot available as a typed Parquet file.
  #
  # This stage owns `data/raw/` now: under `download.source: zenodo` it fetches
  # the pinned file itself, so the manual `dvc add` pointer for the CSV is gone
  # (see docs/docs/data-versioning.md, "Pipeline ownership"). The default is
  # `synthetic`, which needs neither the 548 MB file nor DagsHub credentials;
  # params.yaml says when that flips.
  #
  # The CSV is deliberately neither a `dep` nor an `out`. DVC deletes a stage's
  # outputs before running it, so declaring the CSV would re-download 548 MB on
  # every run; and a `dep` DVC has to hash on every `dvc status` would make the
  # whole pipeline wait on a 548 MB read. `download.md5` is the dependency
  # instead: it pins the bytes, it is a parameter, so re-pinning reruns the
  # stage, and the stage refuses to read a file that hashes to anything else.
  # ----------------------------------------------------------------------
  download:
    cmd: python3 -m recommenditos.data.download_raw_dataset
    deps:
      - recommenditos/data/download_raw_dataset.py
      - recommenditos/data/synthetic.py
      - recommenditos/config.py
      - recommenditos/schema.py
      - recommenditos/pipeline.py
    params:
      - seed
      # Named one by one rather than as the whole `download` block, so a key
      # added there later - a second source's credentials, say - does not
      # invalidate this stage by existing. `rows` is listed although only
      # `synthetic` reads it: a stage's params cannot be conditional, so editing
      # it reruns the stage under `zenodo` too, as a re-read of the cached CSV.
      - download.source
      - download.rows
      - download.zenodo_record
      - download.filename
      - download.md5
    outs:
      - data/raw/listings.parquet

  # ----------------------------------------------------------------------
  # preprocess: raw listings to the interim contract (#34).
  # ----------------------------------------------------------------------
  preprocess:
    cmd: python3 -m recommenditos.data.preprocess
    deps:
      - recommenditos/data/preprocess.py
      - recommenditos/config.py
      - recommenditos/schema.py
      - recommenditos/pipeline.py
      - data/raw/listings.parquet
    params:
      - reference_date
      - preprocess
    outs:
      - data/interim/listings.parquet

  # ----------------------------------------------------------------------
  # configure_gx: build the Great Expectations context and suites (#25).
  #
  # The context under `gx/` is this stage's output, cached and gitignored like
  # `models/`: Great Expectations writes a fresh UUID into every object it saves,
  # so a committed store would change on every rebuild. The module that builds
  # it is the reviewed source of truth (EDN-68). Declaring the output is also
  # what connects this stage to `validate-data`, which depends on it - the
  # course demo's stage declares none and is a disconnected node in the DAG.
  #
  # The suites are written from `schema.py` and from these parameters, so a
  # changed bound reruns this stage and the validation. The validation's summary
  # then changes, so `split` reruns too, and stops the chain there: its outputs
  # come out byte-identical, so nothing after it is out of date.
  # The price bounds are named one by one, so that editing the deduplication key
  # does not rebuild the suites.
  # ----------------------------------------------------------------------
  configure_gx:
    cmd: python3 -m recommenditos.data.gx_context_configuration
    deps:
      - recommenditos/data/gx_context_configuration.py
      - recommenditos/config.py
      - recommenditos/schema.py
      - recommenditos/pipeline.py
    params:
      - reference_date
      - preprocess.price_min_eur
      - preprocess.price_max_eur
      - validate
    outs:
      - gx

  # ----------------------------------------------------------------------
  # validate-data: the data gate (#25).
  #
  # Three things the course demo's equivalent does not do: a failed expectation
  # fails the stage rather than only being logged, the result of every frame is
  # read rather than only the first, and the stage writes a summary that `split`
  # depends on, so the gate sits in the graph. The demo's stage has no `outs`,
  # which makes it a leaf nothing depends on, so `dvc repro split` would walk
  # straight past it.
  #
  # It reads no parameter itself: every bound is in the suites, which is what
  # the dependency on `gx` carries.
  # ----------------------------------------------------------------------
  validate-data:
    cmd: python3 -m recommenditos.data.validate_data
    deps:
      - recommenditos/data/validate_data.py
      - recommenditos/data/gx_context_configuration.py
      - recommenditos/config.py
      - recommenditos/schema.py
      - recommenditos/pipeline.py
      - gx
      - data/raw/listings.parquet
      - data/interim/listings.parquet
    outs:
      # The full validation results and the Data Docs rendered from them. Cached
      # and pushed rather than committed, because both carry the run's timestamp
      # in their paths and their content, so every run would be a diff; `dvc
      # pull` brings them to any clone, and `data-docs/index.html` opens offline.
      - reports/data-validation/results
      - reports/data-validation/data-docs
      # Not cached, so the validation result is git-tracked and shows up in the
      # diff of any pull request that changes the data. It is written without a
      # run id or a timestamp for that reason: what a diff of it shows is what
      # the data did.
      - reports/data-validation/summary.json:
          cache: false

  # ----------------------------------------------------------------------
  # split: hold Spain out (EDN-03), then split grouped by seller (EDN-14).
  # ----------------------------------------------------------------------
  split:
    cmd: python3 -m recommenditos.data.split_data
    deps:
      - recommenditos/data/split_data.py
      - recommenditos/config.py
      - recommenditos/schema.py
      - recommenditos/pipeline.py
      - data/interim/listings.parquet
      - reports/data-validation/summary.json
    params:
      - seed
      - split
    outs:
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - data/processed/calibration.parquet
      - data/processed/test.parquet
      - data/processed/holdout_es.parquet
      - data/processed/supported_makes.json

  # ----------------------------------------------------------------------
  # features: one matrix per feature set, per split (#36).
  #
  # `foreach` over the mapping `features.sets`, so the stages are named
  # `features@basic` and `features@extended` rather than `features@0`, and each
  # declares only its own key under `params:`. Adding a feature set is a change
  # to params.yaml alone.
  #
  # The stage's directory output also holds `feature_space.json`: the contract
  # the matrices were written against and the vocabulary the training rows
  # decided. It needs no `outs` entry of its own because it is inside that
  # directory, and it must not get one - a matrix and the vocabulary that
  # explains it have to be restored together or not at all.
  #
  # `supported_makes.json` is a dependency because this stage applies it: every
  # frame, the `ES` holdout included, is restricted to the makes the API serves
  # before the vocabulary is built (EDN-48, EDN-67). A change to which makes
  # those are therefore changes both the rows of every matrix and the feature
  # space they are encoded in, and a matrix built against the old list has to be
  # rebuilt rather than reused. How `train` and `evaluate` check the result is in
  # docs/docs/pipeline.md under "The supported makes".
  # ----------------------------------------------------------------------
  features:
    foreach: ${features.sets}
    do:
      cmd: python3 -m recommenditos.data.build_features ${key}
      deps:
        - recommenditos/data/build_features.py
        - recommenditos/data/split_data.py
        - recommenditos/config.py
        - recommenditos/schema.py
        - recommenditos/pipeline.py
        - data/processed/train.parquet
        - data/processed/validation.parquet
        - data/processed/calibration.parquet
        - data/processed/test.parquet
        - data/processed/holdout_es.parquet
        - data/processed/supported_makes.json
      params:
        - reference_date
        - features.sets.${key}
        - features.equipment_columns
        - features.equipment_min_frequency
        - features.model_version_tokens
        - features.model_version_min_frequency
      outs:
        - data/processed/features/${key}

  # ----------------------------------------------------------------------
  # train: the experiment ladder, one stage per variant (#37).
  #
  # `${item.feature_set}` resolves at parse time, so `train@lgbm-extended`
  # depends on the extended matrix and `train@b0` on the basic one - DVC knows
  # which feature stage each variant needs without being told twice.
  #
  # It does not declare `features.sets`. The stage does not read it: the matrix's
  # contract travels with the matrices, because the equipment columns and the
  # category levels are whatever the training rows decided. Changing a feature set
  # still retrains, through the directory dependency above - the `features` stage
  # rewrites it first - so nothing is lost by not declaring a key nobody reads.
  #
  # `supported_makes.json` is a dependency because the stage reads it: it checks
  # that the matrices hold the makes the API serves and no others, and records
  # the list in the bundle, which is where the API takes FR-04's scope from
  # (EDN-48, EDN-67). A changed list already reruns this stage through the
  # matrices; declaring it is what keeps the recorded list from disagreeing with
  # the lock.
  #
  # Every `deps` entry of this stage and of `evaluate` is also a tag on the
  # variant's MLflow run, `train.deps.<path>` and `evaluate.deps.<path>`, holding
  # the hash this file's lock records for it (NFR-14, EDN-74). So a dependency
  # added here is traced from the run with no further change, and one the stage
  # reads without declaring it is missing from both.
  #
  # The second output is CodeCarbon's record of the fit (#38), one CSV per
  # variant because two stages may not share an output. Not cached, so a
  # retrain's energy figure shows up in the pull request diff the way
  # `reports/metrics` does. CodeCarbon appends to it, and DVC deletes a stage's
  # outputs before running it, so under `dvc repro` the file always holds exactly
  # the one row of the fit that produced `models/${key}`.
  # ----------------------------------------------------------------------
  train:
    foreach: ${train.variants}
    do:
      cmd: python3 -m recommenditos.modeling.train ${key}
      deps:
        - recommenditos/modeling/train.py
        - recommenditos/modeling/model.py
        - recommenditos/modeling/energy.py
        - recommenditos/tracking.py
        - recommenditos/provenance.py
        - recommenditos/data/build_features.py
        - recommenditos/config.py
        - recommenditos/schema.py
        - recommenditos/pipeline.py
        - data/processed/features/${item.feature_set}
        - data/processed/supported_makes.json
      params:
        - seed
        - train.mlflow_experiment
        - train.num_threads
        - train.energy
        - train.variants.${key}
      outs:
        - models/${key}
        - reports/emissions/${key}.csv:
            cache: false

  # ----------------------------------------------------------------------
  # evaluate: the metrics artefact and the SC-01 to SC-06 gate of NFR-01 (#39).
  #
  # Like `train`, it does not declare `features.sets`: it reads each matrix's
  # contract from the artefact beside it, and it already depends on the whole
  # features directory. It does not declare `features.equipment_columns` either,
  # for the same reason: which multi-hot columns an equipment field produced is in
  # the vocabulary beside the matrices, so SC-06's masking reads it from there and
  # a change to that key reruns this stage through the directory above.
  # ----------------------------------------------------------------------
  evaluate:
    cmd: python3 -m recommenditos.modeling.evaluate
    deps:
      - recommenditos/modeling/evaluate.py
      - recommenditos/modeling/model.py
      - recommenditos/tracking.py
      - recommenditos/provenance.py
      - recommenditos/data/build_features.py
      - recommenditos/config.py
      - recommenditos/schema.py
      - recommenditos/pipeline.py
      - data/processed/features
      - models
    params:
      # `download.source` is declared because the stage reads it: it writes the
      # resolved value into `metrics.json`, so a reader of `dvc metrics show`
      # sees which data the numbers were measured on. Changing the source
      # already reruns this stage through the chain; declaring it is what keeps
      # the recorded value from being able to disagree with the lock.
      - download.source
      - train.variants
      - evaluate
    outs:
      # The full per-variant record, plus the per-segment table and the masking
      # sweep the report cites, as one CSV each across all variants. Not a
      # `metrics` entry: DVC renders one column per JSON leaf, and four variants
      # times six criteria is not a table anyone can read. `metrics.json` below
      # keeps the 24 leaves that are, and the stage docstring says how to read it.
      - reports/metrics:
          cache: false
    metrics:
      - metrics.json:
          cache: false

  # ----------------------------------------------------------------------
  # compare-energy: the ladder's training energy against its test error (#38).
  #
  # The table and the figure the report's energy section is about, built from
  # the artefacts alone so that nobody draws them by hand: each model's own
  # record of its fit, CodeCarbon's row for that fit, and `evaluate`'s metrics.
  # A stage of its own rather than part of `evaluate`, so redrawing the figure
  # does not rerun the evaluation. Both outputs are uncached, so a retrain's
  # effect on them is in the pull request diff.
  #
  # `train.variants` is declared because the stage reads it, for which variants
  # to compare and in what order; a change to one already reruns this through
  # `models`.
  # ----------------------------------------------------------------------
  compare-energy:
    cmd: python3 -m recommenditos.modeling.compare_energy
    deps:
      - recommenditos/modeling/compare_energy.py
      - recommenditos/modeling/energy.py
      - recommenditos/modeling/evaluate.py
      - recommenditos/modeling/model.py
      - recommenditos/tracking.py
      - recommenditos/data/build_features.py
      - recommenditos/config.py
      - recommenditos/schema.py
      - recommenditos/pipeline.py
      - models
      - reports/emissions
      - reports/metrics
    params:
      - train.variants
    outs:
      - reports/figures/energy-vs-error.csv:
          cache: false
      - reports/figures/energy-vs-error.png:
          cache: false
