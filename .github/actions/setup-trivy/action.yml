name: Set up trivy
description: >-
  Installs the trivy release binary, pinned by version and checksum, for
  tools/image_scan.py (NFR-09). Used by the integration job of CI and by CD.

# The release binary rather than aquasecurity/trivy-action or setup-trivy: in
# March 2026 an attacker force-pushed 76 of trivy-action's 77 tags and all of
# setup-trivy's to a credential stealer and published a malicious trivy 0.69.4
# (GHSA-69fq-xp46-6x23). A checksum written here cannot be moved that way; the
# gitleaks job installs its binary the same way. Moving to a new release means
# changing the version, the URL and the checksum below together. The archive is
# cached and downloaded with retries by install-release-binary, which checks the
# checksum either way.
runs:
  using: composite
  steps:
    - name: Install trivy
      uses: ./.github/actions/install-release-binary
      with:
        name: trivy
        version: 0.76.1
        url: https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
        # SHA-256 of trivy_0.76.1_Linux-64bit.tar.gz, from that release's
        # checksums file.
        sha256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        member: trivy
