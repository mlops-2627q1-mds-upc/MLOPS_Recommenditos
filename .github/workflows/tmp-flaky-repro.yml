name: Temporary flaky repro
on:
  push:
    branches: [test/stabilise-json-log-test]
jobs:
  loop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: |
          $failed = 0
          for ($i = 1; $i -le 20; $i++) {
            uv run pytest tests/api/test_logs.py -q --no-cov -p no:cacheprovider -rs -k one_json_object_per_line
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          "FAILED RUNS: $failed of 20"
