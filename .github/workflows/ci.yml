name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      report: ${{ steps.filter.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "recommenditos/**"
              - "tests/**"
              # `tests/conftest.py` imports `tools.requirement_matrix` at module
              # level and 27 tests exercise it, so a change under `tools/` can
              # break or fix the test job.
              - "tools/**"
              - "pyproject.toml"
              - "uv.lock"
              # The pipeline definition and its parameters are code: the tests
              # read dvc.yaml and params.yaml and assert they still describe
              # the modules that exist.
              - "dvc.yaml"
              - "params.yaml"
              - "dvc.lock"
              - ".github/workflows/ci.yml"
            docs:
              - "docs/**"
              - ".github/workflows/ci.yml"
            report:
              - "reports/latex/**"
              - "Makefile"
              - ".github/workflows/ci.yml"

  pre-commit:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  # NFR-07 asks for notebooks that pass the agreed checks without findings. Which
  # Pynblint rules those are, and why the others are excluded, is the table in
  # docs/docs/notebooks.md, and tools/notebook_lint.py gates on exactly that table.
  #
  # No paths filter, for the reason the traceability job gives: the report cites
  # this summary on the delivery commit, whatever that commit touches. It runs in
  # seconds, with no project sync, no data and no credentials.
  notebook-lint:
    name: Notebook lint (Pynblint)
    runs-on: ubuntu-latest
    # It takes seconds; a hang would otherwise hold the runner for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          # The default cache key is the one the test, traceability and docs jobs
          # share, and this job, finishing first, would save a cache holding only
          # Pynblint's environment under it. That environment installs cold in a
          # few seconds anyway.
          enable-cache: false
      # Writes the report first and fails afterwards, so the two steps below
      # still publish what made the job red.
      - name: Lint every notebook
        run: make notebook-lint
      - name: Publish the notebook lint to the job summary
        if: always()
        run: |
          if [ -f reports/notebook-lint.md ]; then
            cat reports/notebook-lint.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## The notebook lint could not run, see the job log.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: notebook-lint
          path: |
            reports/notebook-lint.md
            reports/notebook-lint.json

  test:
    name: Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.code == 'true'
      - run: uv run pytest
        if: needs.changes.outputs.code == 'true'
      # NFR-07's 80 % is reviewed on the delivery commit, so put the coverage
      # of every run in the job summary instead of digging it out of the log.
      - name: Publish coverage to the job summary
        if: needs.changes.outputs.code == 'true'
        run: |
          {
            echo '## Test coverage'
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      # Uploaded even when pytest failed, because that is when the JUnit XML is
      # worth reading: it names the failing tests without scrolling the log.
      - name: Publish the test and coverage reports
        uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml

  # The API image installs `[project] dependencies` alone (EDN-47), because
  # NFR-04 caps it at 1 GB. This is the one job that does not install the full
  # environment: `make test-serving` builds the runtime list plus the `test`
  # group and runs the serving path from it, so a module the API imports that
  # needs a package from one of the groups fails here rather than in M5's image
  # build. The size goes into the job summary, so the number M5 starts from is
  # visible on every change that can move it.
  serving:
    name: Serving runtime
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          # A cache of its own: this job downloads a fraction of what the others
          # do, and under their key it could save that fraction as the cache
          # every other job then restores.
          cache-suffix: serving
      - run: make test-serving
        if: needs.changes.outputs.code == 'true'
      # Without `__pycache__`, so the figure is comparable to the installed size
      # EDN-47 records rather than whatever the test run happened to compile. It
      # includes the `test` group, a few MB that the image will not carry.
      - name: Publish the runtime's installed size to the job summary
        if: needs.changes.outputs.code == 'true'
        run: |
          site=$(.venv-serving/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          {
            echo '## Serving runtime'
            echo
            echo "site-packages of the runtime plus the \`test\` group, without bytecode: $(du -sh --exclude=__pycache__ "$site" | cut -f1)"
            echo
            echo '```text'
            (cd "$site" && du -sh --exclude=__pycache__ -- * | sort -rh | head -n 10)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # NFR-07 promises that every requirement is traceable to the test that
  # verifies it or is marked as verified by hand, and that CI builds the matrix
  # that proves it. The gate is milestone-scoped: see tools/expected_coverage.yaml.
  #
  # No paths filter, unlike every other job here. What NFR-07 promises is the
  # matrix in the job summary of the CI run on the *delivery commit*, and nobody
  # can predict which paths that commit touches: a promotion is a `dvc.lock`
  # change, a delivery is often only `reports/latex/**`, and a filter that misses
  # either produces no matrix at all on exactly the commit the report cites. The
  # job costs a `uv sync` and a collect-only pytest run, with no data and no
  # credentials, which is cheap enough that always running it beats a filter that
  # can silently make the evidence absent.
  traceability:
    name: Requirement matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # Writes the matrix first and fails afterwards, so the two steps below
      # still publish the table that explains why the job is red.
      - name: Build the requirement-to-test matrix
        run: uv run python -m tools.requirement_matrix
      - name: Publish the matrix to the job summary
        if: always()
        run: |
          if [ -f reports/requirement-matrix.md ]; then
            cat reports/requirement-matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## The requirement matrix could not be built, see the job log.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: requirement-matrix
          path: |
            reports/requirement-matrix.md
            reports/requirement-matrix.json

  docs:
    name: Build docs
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.docs == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.docs == 'true'
      - run: uv run mkdocs build --strict
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs

  report:
    name: Build report (${{ matrix.arch }})
    needs: changes
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Apple Silicon and other ARM machines run the arm64 image.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.report == 'true'
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.report == 'true'
      - uses: docker/build-push-action@v7
        if: needs.changes.outputs.report == 'true'
        with:
          context: reports/latex
          tags: mlops-latex
          load: true
          cache-from: type=gha,scope=latex-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=latex-${{ matrix.arch }}
      - run: docker run --rm -v "$PWD/reports/latex:/report" mlops-latex initial
        if: needs.changes.outputs.report == 'true'
      - run: docker run --rm -v "$PWD/reports/latex:/report" mlops-latex final
        if: needs.changes.outputs.report == 'true'
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.report == 'true' && matrix.arch == 'amd64'
        with:
          name: report-pdfs
          path: reports/latex/build/MLOps_*.pdf

  pr-title:
    name: Conventional commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
