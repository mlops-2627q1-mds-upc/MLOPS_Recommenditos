name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      report: ${{ steps.filter.outputs.report }}
      traceability: ${{ steps.filter.outputs.traceability }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "recommenditos/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              # The pipeline definition and its parameters are code: the tests
              # read dvc.yaml and params.yaml and assert they still describe
              # the modules that exist.
              - "dvc.yaml"
              - "params.yaml"
              - "dvc.lock"
              - ".github/workflows/ci.yml"
            docs:
              - "docs/**"
              - ".github/workflows/ci.yml"
            report:
              - "reports/latex/**"
              - "Makefile"
              - ".github/workflows/ci.yml"
            # The matrix joins the `req` markers of the tests with the IDs in
            # the requirement documents, so a change on either side can turn a
            # covered requirement into a gap.
            traceability:
              - "tests/**"
              - "tools/**"
              - "docs/docs/requirements.md"
              - "docs/docs/specification.md"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"

  pre-commit:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    name: Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.code == 'true'
      - run: uv run pytest
        if: needs.changes.outputs.code == 'true'
      # NFR-07's 80 % is reviewed on the delivery commit, so put the coverage
      # of every run in the job summary instead of digging it out of the log.
      - name: Publish coverage to the job summary
        if: needs.changes.outputs.code == 'true'
        run: |
          {
            echo '## Test coverage'
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      # Uploaded even when pytest failed, because that is when the JUnit XML is
      # worth reading: it names the failing tests without scrolling the log.
      - name: Publish the test and coverage reports
        uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml

  # NFR-07 promises that every requirement is traceable to the test that
  # verifies it or is marked as verified by hand, and that CI builds the matrix
  # that proves it. The gate is milestone-scoped: see tools/expected_coverage.yaml.
  traceability:
    name: Requirement matrix
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.traceability == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.traceability == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.traceability == 'true'
      # Writes the matrix first and fails afterwards, so the two steps below
      # still publish the table that explains why the job is red.
      - name: Build the requirement-to-test matrix
        if: needs.changes.outputs.traceability == 'true'
        run: uv run python -m tools.requirement_matrix
      - name: Publish the matrix to the job summary
        if: always() && needs.changes.outputs.traceability == 'true'
        run: |
          if [ -f reports/requirement-matrix.md ]; then
            cat reports/requirement-matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## The requirement matrix could not be built, see the job log.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.traceability == 'true'
        with:
          name: requirement-matrix
          path: |
            reports/requirement-matrix.md
            reports/requirement-matrix.json

  docs:
    name: Build docs
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.docs == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.docs == 'true'
      - run: uv run mkdocs build --strict
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs

  report:
    name: Build report (${{ matrix.arch }})
    needs: changes
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Apple Silicon and other ARM machines run the arm64 image.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.report == 'true'
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.report == 'true'
      - uses: docker/build-push-action@v7
        if: needs.changes.outputs.report == 'true'
        with:
          context: reports/latex
          tags: mlops-latex
          load: true
          cache-from: type=gha,scope=latex-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=latex-${{ matrix.arch }}
      - run: docker run --rm -v "$PWD/reports/latex:/report" mlops-latex initial
        if: needs.changes.outputs.report == 'true'
      - run: docker run --rm -v "$PWD/reports/latex:/report" mlops-latex final
        if: needs.changes.outputs.report == 'true'
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.report == 'true' && matrix.arch == 'amd64'
        with:
          name: report-pdfs
          path: reports/latex/build/MLOps_*.pdf

  pr-title:
    name: Conventional commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
