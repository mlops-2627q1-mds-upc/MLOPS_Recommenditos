name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      report: ${{ steps.filter.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "recommenditos/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"
            docs:
              - "docs/**"
              - ".github/workflows/ci.yml"
            report:
              - "reports/latex/**"
              - "Makefile"
              - ".github/workflows/ci.yml"

  pre-commit:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  test:
    name: Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.code == 'true'
      - run: uv run pytest
        if: needs.changes.outputs.code == 'true'

  docs:
    name: Build docs
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.docs == 'true'
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.docs == 'true'
      - run: uv run mkdocs build --strict
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs

  report:
    name: Build report (${{ matrix.arch }})
    needs: changes
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Apple Silicon and other ARM machines run the arm64 image.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.report == 'true'
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.report == 'true'
      - uses: docker/build-push-action@v7
        if: needs.changes.outputs.report == 'true'
        with:
          context: reports/latex
          tags: mlops-latex
          load: true
          cache-from: type=gha,scope=latex-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=latex-${{ matrix.arch }}
      - run: docker run --rm -v "$PWD/reports/latex:/report" mlops-latex initial
        if: needs.changes.outputs.report == 'true'
      - run: docker run --rm -v "$PWD/reports/latex:/report" mlops-latex final
        if: needs.changes.outputs.report == 'true'
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.report == 'true' && matrix.arch == 'amd64'
        with:
          name: report-pdfs
          path: reports/latex/build/MLOps_*.pdf

  pr-title:
    name: Conventional commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
