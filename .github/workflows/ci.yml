name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      serving: ${{ steps.filter.outputs.serving }}
      docs: ${{ steps.filter.outputs.docs }}
      report: ${{ steps.filter.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code: &code
              - "recommenditos/**"
              - "tests/**"
              # `tests/conftest.py` imports `tools.requirement_matrix` at module
              # level and 27 tests exercise it, so a change under `tools/` can
              # break or fix the test job.
              - "tools/**"
              - "pyproject.toml"
              - "uv.lock"
              # The pipeline definition and its parameters are code: the tests
              # read dvc.yaml and params.yaml and assert they still describe
              # the modules that exist.
              - "dvc.yaml"
              - "params.yaml"
              - "dvc.lock"
              # The EDN and its generated LaTeX: a test asserts the LaTeX is what
              # `make edn` generates from reports/edn.md, and this required job is
              # what makes that gate a merge. The report job's own check is not a
              # required one.
              - "reports/edn.md"
              - "reports/latex/edn/**"
              - ".github/workflows/ci.yml"
            # The serving job runs `make test-serving`, so a change to that target
            # alone has to run it too.
            serving:
              - *code
              - "Makefile"
            docs:
              - "docs/**"
              - ".github/workflows/ci.yml"
            # reports/edn.md and its converter too: the report job checks that
            # the LaTeX EDN is in sync with them, and a change to the notebook
            # alone is exactly the change that leaves it behind.
            report:
              - "reports/latex/**"
              - "reports/edn.md"
              - "tools/edn_latex.py"
              - "Makefile"
              - ".github/workflows/ci.yml"

  pre-commit:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          # The gitleaks hook scans only staged changes, and CI has none, so here
          # it would build gitleaks for minutes and then report a scan of nothing
          # as passed. The `Secret scan (gitleaks)` job below is the CI scan.
          SKIP: gitleaks

  # NFR-07 asks for notebooks that pass the agreed checks without findings. Which
  # Pynblint rules those are, and why the others are excluded, is the table in
  # docs/docs/notebooks.md, and tools/notebook_lint.py gates on exactly that table.
  #
  # No paths filter, for the reason the traceability job gives: the report cites
  # this summary on the delivery commit, whatever that commit touches. It runs in
  # seconds, with no project sync, no data and no credentials.
  notebook-lint:
    name: Notebook lint (Pynblint)
    runs-on: ubuntu-latest
    # It takes seconds; a hang would otherwise hold the runner for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          # The default cache key is the one the test, traceability and docs jobs
          # share, and this job, finishing first, would save a cache holding only
          # Pynblint's environment under it. That environment installs cold in a
          # few seconds anyway.
          enable-cache: false
      # Writes the report first and fails afterwards, so the two steps below
      # still publish what made the job red.
      - name: Lint every notebook
        run: make notebook-lint
      - name: Publish the notebook lint to the job summary
        if: always()
        run: |
          if [ -f reports/notebook-lint.md ]; then
            cat reports/notebook-lint.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## The notebook lint could not run, see the job log.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: notebook-lint
          path: |
            reports/notebook-lint.md
            reports/notebook-lint.json

  test:
    name: Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.code == 'true'
      - run: uv run pytest
        if: needs.changes.outputs.code == 'true'
      # NFR-07's 80 % is reviewed on the delivery commit, so put the coverage
      # of every run in the job summary instead of digging it out of the log.
      - name: Publish coverage to the job summary
        if: needs.changes.outputs.code == 'true'
        run: |
          {
            echo '## Test coverage'
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      # Uploaded even when pytest failed, because that is when the JUnit XML is
      # worth reading: it names the failing tests without scrolling the log.
      - name: Publish the test and coverage reports
        uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml

  # The same suite on Windows, where one of us develops, because Linux cannot
  # show what only Windows does: native paths with backslashes (#74), text files
  # written with CRLF line endings and a console that cannot encode what a
  # library prints (#84). A required check like `Tests` (EDN-75). The coverage
  # and the test reports come from the Linux job; this one only has to pass.
  test-windows:
    name: Tests (Windows)
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.code == 'true'
      - run: uv run pytest
        if: needs.changes.outputs.code == 'true'

  # The API image installs `[project] dependencies` alone (EDN-47), because
  # NFR-04 caps it at 1 GB. This is the one job that does not install the full
  # environment: `make test-serving` builds the runtime list plus the `test`
  # group and runs the serving path from it, so a module the API imports that
  # needs a package from one of the groups fails here rather than in M5's image
  # build. The size goes into the job summary, so the number M5 starts from is
  # visible on every change that can move it.
  serving:
    name: Serving runtime
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.serving == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.serving == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          # A cache of its own: this job downloads a fraction of what the others
          # do, and under their key it could save that fraction as the cache
          # every other job then restores.
          cache-suffix: serving
      - run: make test-serving
        if: needs.changes.outputs.serving == 'true'
      # Without `__pycache__`, so the figure is comparable to the installed size
      # EDN-47 records rather than whatever the test run happened to compile. It
      # includes the `test` group, a few MB that the image will not carry.
      - name: Publish the runtime's installed size to the job summary
        if: needs.changes.outputs.serving == 'true'
        run: |
          site=$(.venv-serving/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          {
            echo '## Serving runtime'
            echo
            echo "site-packages of the runtime plus the \`test\` group, without bytecode: $(du -sh --exclude=__pycache__ "$site" | cut -f1)"
            echo
            echo '```text'
            (cd "$site" && du -sh --exclude=__pycache__ -- * | sort -rh | head -n 10)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # NFR-07 promises that every requirement is traceable to the test that
  # verifies it or is marked as verified by hand, and that CI builds the matrix
  # that proves it. The gate is milestone-scoped: see tools/expected_coverage.yaml.
  #
  # No paths filter, unlike every other job here. What NFR-07 promises is the
  # matrix in the job summary of the CI run on the *delivery commit*, and nobody
  # can predict which paths that commit touches: a promotion is a `dvc.lock`
  # change, a delivery is often only `reports/latex/**`, and a filter that misses
  # either produces no matrix at all on exactly the commit the report cites. The
  # job costs a `uv sync` and a collect-only pytest run, with no data and no
  # credentials, which is cheap enough that always running it beats a filter that
  # can silently make the evidence absent.
  traceability:
    name: Requirement matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # Writes the matrix first and fails afterwards, so the two steps below
      # still publish the table that explains why the job is red.
      - name: Build the requirement-to-test matrix
        run: uv run python -m tools.requirement_matrix
      - name: Publish the matrix to the job summary
        if: always()
        run: |
          if [ -f reports/requirement-matrix.md ]; then
            cat reports/requirement-matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## The requirement matrix could not be built, see the job log.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: requirement-matrix
          path: |
            reports/requirement-matrix.md
            reports/requirement-matrix.json

  # NFR-15: no secret is committed, in any commit of the history. The gitleaks
  # pre-commit hook stops one in a staged change; this job is the net for what
  # reaches GitHub without that hook - a commit made with `--no-verify`, or by
  # someone who never ran `pre-commit install`. The repository is public, so a
  # secret this job finds has already been published with the push: revoke it,
  # do not only remove it (CONTRIBUTING.md).
  #
  # The whole published history, not the tip alone. `gitleaks git` reads every
  # commit of every ref the checkout has: with `fetch-depth: 0` that is every
  # branch and tag, and the fetch below adds the head of every pull request ever
  # opened, which GitHub keeps after a squash merge has deleted the branch. A
  # secret added in one commit and deleted in the next is still published, and a
  # scan of the tip would not see it; one on somebody else's branch is published
  # too, so it turns every pull request red until it is dealt with, which is the
  # point. A rule added later is applied to all of it the same way. A merge
  # commit is read for what it changed itself, so a secret written into a
  # conflict resolution is seen as well (`--remerge-diff`, see
  # tools/secret_scan.py). It scans in a few seconds (228 commits on 2026-10-05).
  #
  # No paths filter, for the traceability job's reason and one more: a secret can
  # arrive in any file, so no list of paths can say which changes need a scan.
  #
  # The release binary, not gitleaks/gitleaks-action: the action needs a licence
  # key for a repository owned by an organisation, which this one is, registered
  # through a form and stored as a repository secret, and pull requests from forks
  # get no secrets (EDN-71). The binary is pinned by version and by checksum.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The `rev` of the gitleaks hook in .pre-commit-config.yaml; the first step
      # fails when the two differ.
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from that release's
      # checksums file. Pinned here rather than downloaded beside the archive,
      # because a checksum fetched from the same place as the file it checks
      # proves nothing about who put either there.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Into a namespace of their own: the checkout already holds this pull
      # request's merge commit as `refs/remotes/pull/<n>/merge`, so mapping the
      # heads to `refs/remotes/pull/<n>` would collide with it and fail the fetch.
      - name: Fetch the head of every pull request
        run: git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/pull-heads/*'
      - name: Check that the pre-commit hook runs the same release
        run: |
          if ! grep -A1 '^  - repo: https://github.com/gitleaks/gitleaks$' .pre-commit-config.yaml \
              | grep -qx "    rev: v${GITLEAKS_VERSION}"; then
            echo "::error file=.pre-commit-config.yaml::the gitleaks hook is not on v${GITLEAKS_VERSION}, the release this job scans with; move both together"
            exit 1
          fi
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # A scan that finds nothing is evidence only if it could have found
      # something, and gitleaks has no rule of its own for a DagsHub token. The
      # canary plants tokens in a throwaway history and scans it with the very
      # command the next step runs, so it fails on whatever would blind that scan.
      - name: Check that the scan still finds a DagsHub token
        run: python3 tools/secret_scan.py canary
      - name: Scan every commit GitHub publishes
        id: scan
        # `shell: bash` for pipefail, so the scan's exit code survives the `tee`.
        shell: bash
        run: python3 tools/secret_scan.py history 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
      # The job's result is what the delivery review reads for NFR-15, so say in
      # the summary what it covered rather than leaving that to the log.
      - name: Publish the scan to the job summary
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          scanned=$(grep -o '[0-9]\+ commits scanned' "$RUNNER_TEMP/gitleaks.log" || echo 'no commit scanned')
          if [ '${{ steps.scan.outcome }}' = success ]; then
            verdict='no leaks found'
          else
            verdict='**leaks found**, see the job log, where they are redacted, and revoke what they name'
          fi
          {
            echo '## Secret scan'
            echo "gitleaks ${GITLEAKS_VERSION} with \`.gitleaks.toml\`, over every branch, tag and pull request head, merge commits included, as of \`$(git rev-parse --short HEAD)\`: ${scanned}, ${verdict}."
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Build docs
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs == 'true'
      - uses: astral-sh/setup-uv@v10.1.0
        if: needs.changes.outputs.docs == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.docs == 'true'
      - run: uv run mkdocs build --strict
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs

  report:
    name: Build report (${{ matrix.arch }})
    needs: changes
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Apple Silicon and other ARM machines run the arm64 image.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.report == 'true'
      # The EDN PDF is built from reports/latex/edn/, which `make edn` generates
      # from reports/edn.md; fail before the build when that is behind, so an
      # entry marked "In LaTeX: yes" is always in the PDF as written. The
      # converter needs only the standard library, so no project sync. The
      # required Tests job runs the same check as a test, which is what blocks
      # a merge; this step says it next to the PDF it concerns.
      - name: Check the LaTeX EDN is in sync with reports/edn.md
        if: needs.changes.outputs.report == 'true'
        run: python3 tools/edn_latex.py --check
      # The image is published to GHCR under a tag that hashes the Dockerfile, so
      # the job pulls it and only builds (TeX Live from a single historic mirror,
      # about 20 minutes) the first time a Dockerfile exists. Nothing here lives in
      # the Actions cache, which GitHub evicts at 10 GB and which the report build
      # therefore must not depend on. A pull request from a fork has a read-only
      # token, so it builds without pushing.
      - name: Name the image after the Dockerfile
        id: image
        if: needs.changes.outputs.report == 'true'
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          hash="$(sha256sum reports/latex/Dockerfile | cut -c1-16)"
          echo "name=ghcr.io/$repo/latex:${{ matrix.arch }}-$hash" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: needs.changes.outputs.report == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published image
        id: pull
        if: needs.changes.outputs.report == 'true'
        run: |
          if docker pull "${{ steps.image.outputs.name }}"; then
            docker tag "${{ steps.image.outputs.name }}" mlops-latex
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.report == 'true' && steps.pull.outputs.hit != 'true'
      - uses: docker/build-push-action@v7
        if: needs.changes.outputs.report == 'true' && steps.pull.outputs.hit != 'true'
        with:
          context: reports/latex
          tags: |
            mlops-latex
            ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: docker run --rm -v "$PWD/reports/latex:/report" mlops-latex initial
        if: needs.changes.outputs.report == 'true'
      - run: docker run --rm -v "$PWD/reports/latex:/report" mlops-latex final
        if: needs.changes.outputs.report == 'true'
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.report == 'true' && matrix.arch == 'amd64'
        with:
          name: report-pdfs
          path: reports/latex/build/MLOps_*.pdf

  pr-title:
    name: Conventional commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
