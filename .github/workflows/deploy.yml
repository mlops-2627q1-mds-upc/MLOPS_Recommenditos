name: Deploy

# Deploys the API image that CD pushed for a merge to main to the FIB Virtech VM,
# checks it from outside with the smoke suite, and puts the previous tag back
# when the check fails (NFR-13, FR-15). On the VM, deploy/deploy.sh does the
# deploying and the rolling back; docs/docs/deployment.md#every-deploy
# describes both.
#
# How it reaches the VM (EDN-94): the VM's SSH port answers only from the UPC
# network (#134), so the jobs that act on the VM run on a self-hosted runner
# there, labelled recommenditos-vm (deploy/install-runner.sh). That runner may
# run nothing but deploy.sh through sudo, so those jobs check nothing out and
# only call it. Everything else runs on GitHub-hosted runners, the smoke check
# too, which keeps the outside view NFR-12 asks for. A public repository's
# self-hosted runner must never run code from a pull request:
# tests/test_workflow_runners.py fails when any other workflow targets it, or
# when this one gains a trigger beside workflow_run and workflow_dispatch.
#
# Off until it is configured (deployment.md#turn-continuous-deployment-on): the
# repository variable DEPLOY_TO_VM turns it on with the value `true`. Otherwise
# a run only writes a summary line saying so and is green. The deploying job
# runs in the GitHub Environment `production`. GitHub's documentation says that
# running a workflow that references a missing environment creates it,
# unprotected; whether a skipped job does so too is not documented, so whoever
# turns CD on first creates the environment, or opens it if it exists, and
# limits it to main.
#
# Started by a finished CD run, so it deploys only an image CD has pushed, and
# always the SHA tag of the commit that run built, never :latest. That commit is
# not the CD run's head_sha, which is main's tip when the CD run started; CD
# names its runs "CD of <SHA>" (`run-name` in cd.yml), and the first job reads
# the SHA from there. CI, CD and this workflow are the three levels of
# `workflow_run` GitHub allows in a chain.
# A manual run (Actions, Deploy, Run workflow on main) deploys the commit SHA it
# is given, older ones too, to redeploy an earlier version on purpose.
on:
  workflow_run:
    workflows: [CD]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Full commit SHA of the image to deploy (a tag CD pushed to GHCR)
        required: true
        type: string

# One deploy at a time, in the order the runs arrive, and never cancelled: a
# cancelled deploy could stop between the new tag and the rollback. A run whose
# CD finished out of order is skipped when the VM already runs a newer commit
# (the step "Skip a commit older than the one that runs"). actionlint 1.7.12
# does not know the `queue` key yet (see cd.yml).
concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  off:
    name: Continuous deployment is off
    if: ${{ vars.DEPLOY_TO_VM != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Say what is missing
        run: |
          msg="Not deployed: the repository variable DEPLOY_TO_VM is not \`true\`, so continuous deployment to the VM is off. docs/docs/deployment.md#turn-continuous-deployment-on lists what turning it on takes."
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Name the commit and check the configuration
    if: >-
      vars.DEPLOY_TO_VM == 'true'
      && ((github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # `actions: read` to look up which jobs the CD run ran.
      actions: read
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      # A manual run skips the check of CD's jobs and deploys what it is given.
      deploy: ${{ steps.pushed.outputs.deploy || 'true' }}
      started-at: ${{ steps.start.outputs.at }}
    steps:
      - name: Note the start time
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Name the commit to deploy
        # The manual run's input, or the SHA in the CD run's title ("CD of <SHA>").
        id: name
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CD_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag=$INPUT_TAG
          else
            tag=$(grep -oE '^CD of [0-9a-f]{40}$' <<< "$CD_TITLE" | cut -d ' ' -f 3 || true)
            if [ -z "$tag" ]; then
              msg="The CD run is titled '$CD_TITLE', not 'CD of <full commit SHA>': check run-name in cd.yml."
              echo "::error::$msg"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          # Checked before it reaches $GITHUB_OUTPUT, which a newline would extend.
          if ! [[ $tag =~ ^[0-9a-f]{40}$ ]]; then
            msg="'$tag' is not a full commit SHA, which is what CD tags images with."
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the configuration
        # The runner's registration cannot be checked from here (listing a
        # repository's runners needs an admin token): without a runner labelled
        # recommenditos-vm online, the deploy job waits in the queue for up to
        # 24 hours, and every later run waits behind it.
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          if ! [[ $SMOKE_URL =~ ^https?://[^[:space:]]+$ ]]; then
            msg="DEPLOY_TO_VM is true, but the repository variable SMOKE_URL is '$SMOKE_URL', not the VM's public http(s) URL (deployment.md#turn-continuous-deployment-on)."
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check that CD pushed an image for this commit
        # A commit that changes only docs/, reports/ or top-level Markdown files
        # builds no image (NFR-13), and its CD run is green all the same.
        if: github.event_name == 'workflow_run'
        id: pushed
        env:
          GH_TOKEN: ${{ github.token }}
          CD_RUN: ${{ github.event.workflow_run.id }}
          TAG: ${{ steps.name.outputs.tag }}
          # The name of the job in cd.yml that pushes the image.
          PUSH_JOB: Build, test and push the API image
        run: |
          conclusion=$(gh run view "$CD_RUN" --repo "$GITHUB_REPOSITORY" --json jobs \
            | jq -r --arg name "$PUSH_JOB" '[.jobs[] | select(.name == $name)][0].conclusion // "absent"')
          case "$conclusion" in
            success) echo "deploy=true" >> "$GITHUB_OUTPUT" ;;
            skipped)
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "CD built no image for \`$TAG\`, which changes only docs/, reports/ or top-level Markdown files, so there is nothing to deploy (NFR-13)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              msg="The CD run $CD_RUN has no successful job '$PUSH_JOB' (found: $conclusion). If cd.yml renamed the job, rename PUSH_JOB here too."
              echo "::error::$msg"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

  deploy:
    name: Deploy on the VM
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    # The runner on the VM: it may only run deploy.sh as the deploy user, with
    # `sudo -n -u recommenditos /opt/recommenditos/deploy.sh` and one of its
    # three commands (the sudoers rule of install-runner.sh).
    runs-on: [self-hosted, recommenditos-vm]
    # A pull, up to 10 minutes for deploy.sh's lock, and two --wait of 3 minutes.
    timeout-minutes: 30
    # Only main may deploy to this environment.
    environment:
      name: production
      url: ${{ vars.SMOKE_URL }}
    permissions:
      # To compare the commit with the one that runs, through the API.
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      DEPLOY_SH: /opt/recommenditos/deploy.sh
    outputs:
      before: ${{ steps.before.outputs.running }}
      deployed: ${{ steps.order.outputs.deploy }}
      now: ${{ steps.result.outputs.now }}
      said: ${{ steps.result.outputs.said }}
    steps:
      - name: Read the tag the VM runs
        id: before
        run: |
          running=$(sudo -n -u recommenditos "$DEPLOY_SH" status | sed -n 's/^running: //p' | tail -n 1)
          # Checked before it reaches $GITHUB_OUTPUT, which a newline would extend.
          [[ $running =~ ^[0-9a-f]{40}$ ]] || running=
          echo "running=$running" >> "$GITHUB_OUTPUT"

      - name: Skip a commit older than the one that runs
        # :latest's rule from cd.yml: when the CD runs of two merges finish in
        # the opposite order, the older commit must not replace the newer one.
        # A manual run deploys whatever it is given. The API compares the two
        # commits, since this runner has no clone: "ahead" means the running
        # commit contains this one. When it cannot answer, the commit deploys.
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNING: ${{ steps.before.outputs.running }}
        run: |
          deploy=true
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ -n "$RUNNING" ] && [ "$RUNNING" != "$TAG" ]; then
            if relation=$(curl -fsS -m 30 -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$TAG...$RUNNING?per_page=1" \
                | jq -r .status); then
              if [ "$relation" = ahead ]; then
                deploy=false
                echo "Not deployed: the VM runs \`$RUNNING\`, a newer commit that contains \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::warning::GitHub could not compare $TAG with $RUNNING, so the commit deploys without the check."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Deploy, and put the previous tag back if the stack does not come up
        if: steps.order.outputs.deploy == 'true'
        id: deploy
        run: sudo -n -u recommenditos "$DEPLOY_SH" deploy "$TAG" | tee "$RUNNER_TEMP/deploy.log"

      - name: Report the outcome
        if: always() && steps.deploy.outcome != 'skipped'
        id: result
        run: |
          now=$(sed -n 's/^running: //p' "$RUNNER_TEMP/deploy.log" 2>/dev/null | tail -n 1)
          [[ $now =~ ^[0-9a-f]{40}$ ]] || now=
          said=$(grep '^deploy.sh: ' "$RUNNER_TEMP/deploy.log" 2>/dev/null | tail -n 2 | sed 's/^deploy.sh: //' | paste -sd ';' - || true)
          echo "now=$now" >> "$GITHUB_OUTPUT"
          echo "said=$said" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke check from outside the VM (NFR-12)
    needs: [prepare, deploy]
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deployed commit: the smoke suite holds /health to its dvc.lock.
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          save-cache: false
      - run: uv sync --locked
      - name: Run the smoke suite against the VM's public URL
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: make smoke SMOKE_URL="$SMOKE_URL"

  rollback:
    name: Put the previous tag back
    needs: [deploy, smoke]
    if: always() && needs.smoke.result == 'failure'
    runs-on: [self-hosted, recommenditos-vm]
    timeout-minutes: 15
    permissions: {}
    outputs:
      now: ${{ steps.result.outputs.now }}
      said: ${{ steps.result.outputs.said }}
    steps:
      - name: Put the previous tag back
        run: sudo -n -u recommenditos /opt/recommenditos/deploy.sh rollback | tee "$RUNNER_TEMP/rollback.log"

      - name: Report the outcome
        if: always()
        id: result
        run: |
          now=$(sed -n 's/^running: //p' "$RUNNER_TEMP/rollback.log" 2>/dev/null | tail -n 1)
          [[ $now =~ ^[0-9a-f]{40}$ ]] || now=
          said=$(grep '^deploy.sh: ' "$RUNNER_TEMP/rollback.log" 2>/dev/null | tail -n 2 | sed 's/^deploy.sh: //' | paste -sd ';' - || true)
          echo "now=$now" >> "$GITHUB_OUTPUT"
          echo "said=$said" >> "$GITHUB_OUTPUT"

  summary:
    name: Write the summary
    needs: [prepare, deploy, smoke, rollback]
    # Whenever the run got as far as the VM and did not skip the commit there.
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.deploy == 'true'
      && needs.deploy.outputs.deployed != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      STARTED_AT: ${{ needs.prepare.outputs.started-at }}
      SMOKE_URL: ${{ vars.SMOKE_URL }}
      BEFORE: ${{ needs.deploy.outputs.before }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      DEPLOYED: ${{ needs.deploy.outputs.deployed }}
      DEPLOY_NOW: ${{ needs.deploy.outputs.now }}
      DEPLOY_SAID: ${{ needs.deploy.outputs.said }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
      ROLLBACK_RESULT: ${{ needs.rollback.result }}
      ROLLBACK_NOW: ${{ needs.rollback.outputs.now }}
      ROLLBACK_SAID: ${{ needs.rollback.outputs.said }}
    steps:
      - name: Write the run summary
        run: |
          now=$DEPLOY_NOW
          case "$DEPLOY_RESULT/$SMOKE_RESULT" in
            success/success) result="deployed" ;;
            success/failure)
              now=$ROLLBACK_NOW
              if [ "$ROLLBACK_RESULT" = success ]; then
                result="the smoke check failed, so the previous tag was put back"
              else
                result="the smoke check failed, and putting the previous tag back failed too: ${ROLLBACK_SAID:-the runner on the VM did not answer}"
              fi
              ;;
            failure/*)
              if [ "$DEPLOYED" = true ]; then
                result="the deploy failed: ${DEPLOY_SAID:-deploy.sh said nothing}"
              else
                result="the deploy job failed before it deployed: see its log"
              fi
              ;;
            *) result="stopped before the deploy finished (deploy job: $DEPLOY_RESULT, smoke check: $SMOKE_RESULT)" ;;
          esac
          elapsed=$(( $(date +%s) - STARTED_AT ))
          {
            echo "### Deploy of \`$TAG\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Result | $result |"
            echo "| Ran before | \`${BEFORE:-nothing}\` |"
            echo "| **Runs now** | \`${now:-unknown, see the jobs on the VM}\` |"
            echo "| Smoke check against | $SMOKE_URL |"
            echo "| Run time | $(( elapsed / 60 )) min $(( elapsed % 60 )) s |"
          } >> "$GITHUB_STEP_SUMMARY"
