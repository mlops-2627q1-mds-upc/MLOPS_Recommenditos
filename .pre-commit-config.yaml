default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # --enforce-all: without it the hook checks only files staged for addition,
      # so CI's run over every file would check nothing at all.
      - id: check-added-large-files
        args: ["--maxkb=1000", "--enforce-all"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: "0.9.1"
    hooks:
      - id: nbstripout

  # NFR-15: scans the staged change for a secret, with the rules of .gitleaks.toml,
  # before the commit exists. The `gitleaks` hook rather than `gitleaks-system` or
  # `gitleaks-docker`, because it is the one that needs nothing installed by hand:
  # pre-commit builds it from source, downloading Go first if there is none. That
  # costs a few minutes once per machine and version (EDN-71); afterwards a commit
  # pays milliseconds. `rev` is the release the `Secret scan (gitleaks)` CI job
  # pins as GITLEAKS_VERSION, and that job fails when the two differ, so a commit
  # is judged by the same rules locally and in CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
