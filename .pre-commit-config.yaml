default_install_hook_types: [pre-commit, commit-msg]
# A hook without `stages` would otherwise run in the commit-msg stage too, with
# no files, and print a second "(no files to check) Skipped" line for every file
# check of a commit, below the line that checked the staged files.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # --enforce-all: without it the hook checks only files staged for addition,
      # so CI's run over every file would check nothing at all.
      - id: check-added-large-files
        args: ["--maxkb=1000", "--enforce-all"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  # ruff runs from the project's environment, so the hooks, `make lint` and the
  # other CI jobs all use the ruff pinned in uv.lock. A `rev:` on ruff-pre-commit
  # would be a second pin that Dependabot's uv group does not move, and the two
  # versions would drift until a hook disagreed with CI about formatting.
  # The ids, `--force-exclude` (so `extend-exclude` applies to the paths pre-commit
  # passes) and the file types are those of ruff-pre-commit's `ruff-check` and
  # `ruff-format` hooks. `uv run` is the one entry that is the same on Linux,
  # macOS and Windows.
  #
  # EDN-83: mypy over `recommenditos/` and `tools/`, configured in pyproject.toml.
  # Also a local hook that runs the project's own environment, because mypy
  # resolves the imports against the installed packages and an isolated hook
  # environment would leave every one of them unresolved. It checks the whole
  # configured tree on every run, not the staged files, since a change in one
  # module can break the types of another. CI runs these hooks in the
  # `Lint & format` job after a `uv sync --locked`, so the job a merge requires
  # fails on a lint, format or type error.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        files: ^(recommenditos/|tools/|pyproject\.toml$|uv\.lock$)
        types_or: [python, toml]
        pass_filenames: false

  - repo: https://github.com/kynan/nbstripout
    rev: "0.9.1"
    hooks:
      - id: nbstripout

  # Lints the Dockerfiles of the API image and of the report's TeX Live image.
  # hadolint-py installs the released hadolint binary as a Python wheel, so the
  # hook needs neither Docker nor a system package and runs the same on Linux,
  # macOS and Windows.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        files: ^(reports/latex/)?Dockerfile$

  # Lints the GitHub workflows: expressions, job and step references, action
  # inputs, and the shell of every `run:` with shellcheck, which the wheel of
  # shellcheck-py brings along on Linux, macOS and Windows. Configured in
  # .github/actionlint.yaml.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py==0.11.0.1]

  # The shell scripts themselves, such as deploy/bootstrap.sh, with the same
  # shellcheck release that actionlint uses for the workflows.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # NFR-15: scans the staged change for a secret, with the rules of .gitleaks.toml,
  # before the commit exists. The `gitleaks` hook rather than `gitleaks-system` or
  # `gitleaks-docker`, because it is the one that needs nothing installed by hand:
  # pre-commit builds it from source, downloading Go first if there is none. That
  # costs a few minutes once per machine and version (EDN-71); afterwards a commit
  # pays milliseconds. `rev` is the release the `Secret scan (gitleaks)` CI job
  # pins as GITLEAKS_VERSION, and that job fails when the two differ, so a commit
  # is judged by the same rules locally and in CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
