site_name: Recommenditos
#
site_author: Team Recommenditos
#
# Mermaid diagrams (architecture.md): the module turns ```mermaid blocks into
# diagrams in the browser, so the build needs no plugin.
extra_javascript:
  - path: javascripts/mermaid-init.js
    type: module
plugins:
  - search
  # Renders docs/openapi.json on the API reference page with Swagger UI, whose
  # assets the plugin ships, so the site builds and works offline.
  - swagger-ui-tag
