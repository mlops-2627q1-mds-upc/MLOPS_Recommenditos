[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "recommenditos"
version = "0.0.1"
description = "Car price estimation ML system \u2013 MLOps course project (UPC 2026/27)"
authors = [
  { name = "Team Recommenditos" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "coverage",
    "dvc",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    # Experiment tracking against the DagsHub tracking server. The course demo
    # pins `>=2.22,<3` for DagsHub compatibility; that ceiling is not carried
    # over, because 3.16.1 was verified against
    # dagshub.com/recommenditos/MLOPS_Recommenditos.mlflow on 2026-09-30 - a run
    # with a parameter and a metric was logged, read back through the client and
    # shown in the UI. The floor is the version that was measured, not a guess.
    # `<4` because 3.16 already changed two defaults this project depends on - the
    # file store now refuses to run and an unset tracking URI resolves to a local
    # SQLite database - and NFR-06's reproducibility promise should not rest on
    # whatever a major release does next. Raising it is a deliberate act with a
    # re-verification against DagsHub, which is the point.
    "mlflow>=3.16.1,<4",
    "notebook",
    "nbstripout",
    "numpy",
    # pandas 3 or newer: the contract relies on its `str` dtype and on
    # `astype("str")` preserving a missing value instead of writing "nan".
    "pandas>=3",
    "pip",
    "pre-commit",
    # Parquet is the interchange format between pipeline stages: it is typed, so
    # a frame keeps its dtypes across a stage boundary instead of being re-inferred.
    "pyarrow",
    "pytest",
    "pytest-cov",
    "python-dotenv",
    # The `download` stage streams the raw file from Zenodo. It arrives with DVC
    # anyway, but a direct import of a transitive dependency breaks the day that
    # dependency changes, so it is declared here.
    "requests",
    # params.yaml, read by every stage and by the tests that check dvc.yaml.
    "pyyaml",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.pytest.ini_options]
markers = [
    "req(*ids): requirement IDs this test verifies, e.g. req(\"FR-04\") or req(\"FR-15\", \"NFR-01\"); see docs/docs/requirements.md",
]
# Every `pytest` run reports the coverage of the package, so the number NFR-07
# asks for is always in front of us. There is no `--cov-fail-under`: NFR-07
# checks the 80 % on the delivery commit, and a per-PR gate would block merges
# while the test suite is still being built. Bare `--cov` measures whatever
# `[tool.coverage.run]` below says, so the scope lives in one place only.
#
# The two files under `reports/` are for whoever reads the run instead of
# watching it: CI uploads them, so a failure on a delivery commit can be read
# test by test and line by line months later. Which test verified which
# requirement is the matrix of NFR-07, not this record. Both files are rewritten
# by every run and therefore gitignored.
addopts = [
    "--cov",
    "--cov-report=term",
    "--cov-report=xml:reports/coverage.xml",
    "--junitxml=reports/junit.xml",
]
testpaths = ["tests"]
# `tests/` and `tools/` are repository code, not part of the installed
# `recommenditos` package, so the shared fixture constants and the matrix
# generator are only importable if the root is on the path.
pythonpath = ["."]
filterwarnings = [
    # mlflow 3.16's SQLAlchemy tracking store builds its trace-metadata mapper
    # with the `noload` strategy, which SQLAlchemy deprecated in 2.1
    # (mlflow/store/tracking/utils/sql_trace_metrics_utils.py). Nothing on our
    # side triggers it and nothing on our side can fix it, so it is filtered by
    # its message rather than left to be scrolled past in every run - and
    # narrowly, because a `noload` that ever appears in our own code should still
    # be a warning. Drop this once mlflow stops using it.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["recommenditos"]
# Branch coverage, so a half-tested `if` does not count as fully covered.
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    # CLI entry points: `app()` runs only when the module is executed as a
    # script, which pytest never does.
    'if __name__ == .__main__.:',
]

[tool.ruff]
line-length = 99
src = ["recommenditos"]
# No `include`: pre-commit passes changed files to ruff explicitly and ruff does
# not apply `include` to explicit paths, so an `include` would only make a local
# `ruff check` blind to files CI still lints. Default discovery keeps the two in
# step, and new top-level Python is linted without touching this file.
# The one-off scripts behind EDN entries are excluded: they are evidence, kept as
# they were run (see reports/analysis/README.md), not product code. NFR-07's lint
# requirement is about `recommenditos/`.
extend-exclude = ["reports/analysis"]

[tool.ruff.lint]
# The course demo's set: pycodestyle errors, Pyflakes, pyupgrade, bugbear,
# simplify, import sorting and Pylint. NFR-07 requires the Pylint rules in
# particular.
extend-select = ["E", "F", "UP", "B", "SIM", "I", "PL"]

[tool.ruff.lint.per-file-ignores]
# `recommenditos/tracking.py` sets MLFLOW_DISABLE_AGENT_HINT before `import
# mlflow`, because mlflow reads that one at import time and cannot be told
# afterwards. The imports below it are deliberately not at the top of the file.
"recommenditos/tracking.py" = ["E402"]
# A test asserts against literal expected values - that is what an assertion is.
# PLR2004 earns its place in `recommenditos/`, where a bare threshold should get
# a name, but not on `assert response.status_code == 422`.
"tests/**/*.py" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["recommenditos"]
force-sort-within-sections = true
