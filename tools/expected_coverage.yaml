# When each requirement owes evidence, and how far CI already enforces that.
#
# The gate is deliberately not "every requirement is verified". Before M4 there
# is no API, so every FR-xx would fail a build that nobody can fix, and a gate
# that is always red stops being read. Instead every requirement is booked to
# the milestone whose work produces its evidence, and CI enforces the milestones
# up to `current`. Tightening the gate is then a one-line diff - bump `current`
# - which a reviewer sees and the commit dates.
#
# Every FR-xx and NFR-xx of docs/docs/requirements.md appears exactly once
# below. tools/requirement_matrix.py fails when one is missing or unknown, so a
# requirement cannot enter the docs without someone deciding when it is due.
#
# What the gate can check is that a requirement has a route to evidence: a test
# carrying its ID where the specification says a test is the evidence, or the
# named manual evidence of its "Verified by" cell where it says a person is. It
# cannot check that a drill was actually run, and it cannot read a test body and
# judge whether it verifies the criterion - that is the review NFR-07 asks a
# person to do before each delivery.
#
# The milestone names are validated against M1 to M6 and the gate enforces every
# milestone at or before `current` by that order, not by the order the blocks
# happen to appear in here. A requirement is therefore moved out of the gate only
# by moving it to a later milestone, which is a line a reviewer reads.
#
# A milestone here is the one whose work produces the *last* piece of the
# requirement's evidence, not the practice its topic belongs to. A requirement
# whose evidence is half M3 work and half M4 work is booked M4, because that is
# when it can first be complete.

current: M3

milestones:
  - milestone: M3
    practice: Model building - reproducibility and quality assurance
    requirements:
      # The model gate, the pipeline and the repository quality checks are all
      # in place by the first delivery, so their evidence is due now.
      - NFR-01
      - NFR-06
      - NFR-07
      - NFR-08
      # The two halves EDN-66 split out of NFR-06 and NFR-09 so that neither
      # waits for the other. Run provenance is recorded by the tracking seam and
      # the `train` stage, both merged. The secret scan guards credentials that
      # every contributor has held since the DagsHub remote arrived (EDN-46), so
      # it is due from the moment the risk is, not from when the API exists.
      - NFR-14
      - NFR-15

  - milestone: M4
    practice: Model deployment - the API
    requirements:
      # Every functional requirement is a promise about a request and its
      # answer, so none of them can be tested before the API exists.
      - FR-01
      - FR-02
      - FR-03
      - FR-04
      - FR-05
      - FR-06
      - FR-07
      - FR-08
      - FR-09
      - FR-10
      - FR-11
      - FR-13
      - FR-16
      # Latency, throughput and the request-size limit are measured against a
      # running API, on the machine of EDN-17.
      - NFR-02
      - NFR-03
      # The running system's security, without the repository's secret hygiene,
      # which EDN-66 moved to NFR-15 and M3. Its first evidence is the body-limit
      # test against the API. Its image scan, Dockerfile review and the check from
      # outside the VM need the image and the deployment of M5; booked M4 as
      # decided with that split, so the delivery review is what notices if they
      # are still missing then.
      - NFR-09
      # Energy efficiency is an M3 practice and the emissions half is M3 work,
      # done in issue #38 and named by a test, but the specification's evidence
      # for NFR-10 also names the energy-per-request figure from the NFR-03 load
      # test, which needs the API. Booked M4 because that is the first milestone
      # at which the entry can be complete.
      - NFR-10

  - milestone: M5
    practice: Model deployment - packaging and delivery
    requirements:
      # These need the image and the Compose stack: the model is baked into the
      # image at build time (FR-12, EDN-08), the restart policy and the disk
      # caps are Compose settings, and the deployment is what CD performs.
      - FR-12
      - NFR-04
      - NFR-05
      - NFR-12
      - NFR-13

  - milestone: M6
    practice: Monitoring
    requirements:
      # The drift job and the retraining chain start from a monitoring finding,
      # so their evidence is the ES replay of M6.
      - FR-14
      - FR-15
      - NFR-11
