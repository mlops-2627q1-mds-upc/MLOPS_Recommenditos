# Pipeline configuration, in one place.
#
# Every stage in dvc.yaml declares the keys it reads under `params:`, so a
# change here reruns exactly the stages it affects and `dvc exp` can sweep it.
# This is a deliberate deviation from the course demo, which keeps the same
# settings as Python constants in `config.py` (EDN-30).
#
# Paths are NOT here. They live in `recommenditos/config.py`, derived from the
# repository root, so nothing depends on a machine-specific absolute path.

# Every stage that draws a random number takes this seed, so `dvc repro` on a
# clean clone reproduces the same splits and metrics (NFR-06).
seed: 20251108

# The snapshot date of the raw file. Age is this date minus `registration_date`
# in training, and the request date in serving (problem-spec section 4).
# Listings registered after it are dropped (EDN-22).
reference_date: "2025-11-08"

download:
  # `zenodo` fetches the real snapshot; `synthetic` generates a stand-in, which
  # is what lets the test suite and a clean clone run with no network and no
  # credentials.
  #
  # A pipeline running on synthetic data cannot pass unnoticed: because the
  # value is a parameter, the committed `dvc.lock` records which source every
  # artefact was built from, and `dvc status` reports a workspace that disagrees
  # with it. `dvc params diff` does not show this - it compares the params files
  # of two Git revisions, not the lock against the workspace. `evaluate` writes
  # the resolved value into `metrics.json` as well, so a number read off
  # `dvc metrics show` carries the data it was measured on.
  source: zenodo
  # Used only by `source: synthetic`.
  rows: 20000
  # Used only by `source: zenodo`. The MD5 is the checksum Zenodo publishes, so
  # anyone can verify our copy is the original, and the stage refuses to read
  # bytes that hash to anything else. Because it is a parameter, re-pinning the
  # file is a change DVC sees and reruns on - which is also what stands in for
  # the 548 MB CSV not being a dependency of the stage (see dvc.yaml).
  zenodo_record: "17643343"
  filename: autoscout24_dataset_20251108.csv
  md5: b23a122cc51baf7de39f449193ff0d28

preprocess:
  # Scope: used passenger cars only (EDN-04). `is_preregistered` rows are
  # excluded even though the flag is unreliable (EDN-24).
  offer_type: U
  vehicle_type: Car
  # Training price range in EUR. Below 500 the listings are placeholders and
  # data-entry errors (the raw file starts at 1 EUR); above 2M they are
  # collector cars the model has no support for.
  price_min_eur: 500
  price_max_eur: 2000000
  # `vin` is only 34 % filled, so a VIN key cannot find the duplicates. This
  # composite key finds about 6,347 of them in the raw file (dataset card).
  dedup_key:
    - make
    - model
    - model_version
    - mileage_km_raw
    - registration_date
    - price
    - power_kw
  # Dropped before anything else is written, so no processed artefact, model or
  # log can carry them (NFR-08). `seller_company_name` survives only as the
  # hashed `seller_group_id`, which `split` groups by.
  pii_columns:
    - vin
    - street
    - zip
    - city
    - latitude
    - longitude
    - seller_company_name

split:
  # Held out whole as the new-market drift scenario for M6 (EDN-03). No row of
  # this country may reach training, validation, calibration or test.
  holdout_country: ES
  # A make enters the supported list at this many listings, counted after the
  # holdout is removed and before the split (EDN-05). The list is computed and
  # written as an artefact, never hard-coded: the API reads it from the model
  # metadata (specification FR-04).
  min_listings_per_make: 300
  # No seller appears in two sets: held-out dealers shift the feature
  # distribution as much as a different country does (EDN-14), so a random
  # split would leak a dealer into train and test and flatter every metric.
  group_key: seller_group_id
  # The test share is 20 % because SC-04 only checks a segment once it holds
  # 500 test rows, and below about 15 % Volvo and then Suzuki fall under that
  # bar (reports/analysis/make_support_results.txt). The remaining 80 % is split
  # 60/10/10: validation for early stopping and tuning, calibration only for
  # the conformal intervals of UC2 (problem-spec section 5).
  ratios:
    train: 0.60
    validation: 0.10
    calibration: 0.10
    test: 0.20

features:
  # Column names are the raw ones, except `age_years`, which `build_features`
  # derives as `reference_date` minus `registration_date`. Each set names the
  # inputs; how a column becomes model columns (native categorical, multi-hot,
  # parsed text) is the stage's business, not this file's.
  sets:
    # Experiment ladder step 3, the main model's inputs (problem-spec section 4).
    basic:
      - make
      - model
      - body_type
      - age_years
      - mileage_km_raw
      - nr_prev_owners
      - power_kw
      - fuel_category
      - transmission
      - drive_train
      - gears
      - cylinders_volume_cc
      - nr_seats
      - nr_doors
      - country_code
      - seller_type
    # Experiment ladder step 4: everything above, plus the columns whose worth
    # the ladder is meant to measure.
    extended:
      - make
      - model
      - body_type
      - age_years
      - mileage_km_raw
      - nr_prev_owners
      - power_kw
      - fuel_category
      - transmission
      - drive_train
      - gears
      - cylinders_volume_cc
      - nr_seats
      - nr_doors
      - country_code
      - seller_type
      - equipment_comfort
      - equipment_entertainment
      - equipment_extra
      - equipment_safety
      - has_full_service_history
      - non_smoking
      - is_rental
      - body_color
      - paint_type
      - upholstery
      - upholstery_color
      - model_version
      - weight_kg
      - cylinders
      - electric_range_km
      - envir_standard
      - original_market
  # The four equipment columns are Python-repr list strings, never null: an
  # empty list is the literal "[]". They become multi-hot columns.
  equipment_columns:
    - equipment_comfort
    - equipment_entertainment
    - equipment_extra
    - equipment_safety
  # An equipment item becomes its own column only above this share of the
  # training rows of the supported makes (EDN-67), so the matrix does not grow a
  # tail of near-constant columns. It keeps 133 of the 146 items those rows hold,
  # the same 133 as over every training row (2026-10-05).
  equipment_min_frequency: 0.01
  # `model_version` is free text truncated at 50 characters, multilingual and
  # full of marketing: 80,332 distinct values over the 105,405 scoped listings,
  # and folding case, accents and separators still leaves 78,738. So the stage
  # keeps only the leading tokens of the normalised trim; one token leaves 2,882
  # distinct values, two leaves 18,248.
  model_version_tokens: 1
  # A normalised trim becomes a level only above this share of the training
  # rows of the supported makes. Below it the value is missing rather than a
  # level of its own, the same treatment any absent value gets (EDN-15). One
  # token at this threshold keeps 278 levels covering 86.5 % of those rows; at
  # 0.001 it keeps 167 covering 78.8 % (2026-10-05).
  #
  # Both values are coarse on purpose and the ladder is meant to sweep them: the
  # leading token names the body style for some makes and the engine letter for
  # others, which merges heavily (EDN-41). The counts above are measured by
  # reports/analysis/served_vocabulary.py; the merging and the rejected finer
  # alternatives are in the model card and in
  # reports/analysis/extended_features.py (2026-09-30).
  model_version_min_frequency: 0.0005

validate:
  # Bounds the Great Expectations suites assert (#25). The price range lives
  # under `preprocess`, because there it is a scope filter rather than a check.
  # The mileage range is the one FR-03 accepts at serving time.
  mileage_min_km: 0
  mileage_max_km: 1000000
  # The share of rows the mileage rule requires inside that range, on both
  # frames. It is a check and not a filter, so the published file's three
  # listings above 1,000,000 km (the highest 2,570,000 km, all three in the
  # cleaned frame too) are reported, not removed. 0.999 tolerates more than thirty
  # times that count before the stage fails, so a scrape in another unit or with
  # a shifted decimal is caught while three typos are not.
  mileage_mostly: 0.999
  # Both suites fail a frame with fewer rows than this. Every column rule holds
  # vacuously over no rows, so without it an empty or truncated frame would pass.
  # Far below any real scrape (118,382 raw and 105,405 cleaned rows) and below
  # the 2,000-row test fixture, so it only fires on a frame that has lost almost
  # everything.
  min_rows: 1000
  # The share of rows each column a bounded rule reads must fill, on both
  # frames. Great Expectations skips missing values, so a range over a column
  # that has emptied out holds vacuously. Measured on the snapshot, the lowest of
  # these fill rates is the raw `mileage_km_raw` at 99.46 %.
  filled_mostly: 0.99
  # The raw suite asserts `registration_date <= reference_date` with this
  # tolerance rather than as a hard rule, so a future scrape carrying many such
  # rows is flagged instead of silently cleaned. The cleaned frame asserts it
  # hard, because preprocessing has dropped them by then.
  raw_mostly: 0.99

train:
  # One MLflow experiment; each variant below is one run in it (#37).
  mlflow_experiment: recommenditos-price
  # Threads for the fit, pinned rather than left at LightGBM's default of "all
  # cores". The trees are already thread-independent - identical at 1, 2, 4 and 8
  # threads - but LightGBM writes the count into `booster.txt`, so a default would
  # make the artefact's hash depend on the machine that ran `dvc repro` (NFR-06).
  #
  # 1 rather than a larger pinned value, because only 1 is a value every machine
  # can honour: LightGBM silently uses what is available, so a 2-core runner asked
  # for 4 writes a different file than an 8-core laptop.
  #
  # What that costs, and against what (EDN-53). Against a *pinned* 2 or 4 it is a
  # real trade: measured on the real snapshot, `lgbm-extended` fits in a median
  # 18.3 s at 1 thread against 12.2 s at 4. Against the default this replaces -
  # every core, 8 on the machine measured - it is a gain: 18.3 s against 29.2 s,
  # and 7.1 s against 17.7 s for `lgbm-basic`. It is also by far the steadiest
  # value: three fits at 1 thread land within a second of each other, three at 8
  # span 26 s. The same reversal is sharper on the 744-row fixture the suite uses
  # (0.33 s at 1 thread, 28.6 s at 8), because OpenMP's overhead dominates
  # whenever there is little work per thread.
  num_threads: 1
  # How CodeCarbon measures the fit (NFR-10, issue #38, EDN-69). Only the fit is
  # measured, and `recommenditos/modeling/energy.py` says what the figure is: on a
  # machine where RAPL is root-only, which is every Linux machine we train on, it
  # is CodeCarbon's estimate from the CPU's TDP and the process's CPU time plus a
  # constant 10 W for the RAM, not a meter reading.
  energy:
    # The fit's own CPU time, not the whole machine's load: measured on a shared
    # laptop, `machine` mode charged a sleeping process 4.5 W of CPU, `process` 0.3 W.
    tracking_mode: process
    # The grid the emissions are computed against, pinned so that an identical fit
    # has identical emissions wherever it runs, and so that measuring needs no
    # geolocation call. Spain, because the team trains in Barcelona; CodeCarbon's
    # factor for it is 174.05 g CO2eq/kWh (Our World in Data, 2023).
    country_iso_code: ESP
    # How often power samples are integrated into energy. CodeCarbon's default
    # rather than the demo's 1 s, which races the tracker's own shutdown: measured
    # against CodeCarbon's own model, 1 s gave 0.86x to 1.07x on a LightGBM fit and
    # up to 4.31x on a busy loop, 15 s gave 0.987x to 0.993x on the same fit.
    measure_power_secs: 15
  # `dvc.yaml` iterates this mapping with `foreach`, so the stages are named
  # `train@b0`, `train@lgbm-basic` and so on, and each declares only its own
  # key under `params:`. Changing one variant therefore retrains that variant
  # alone. Adding a model is a change to this file, not to the code.
  variants:
    # Ladder step 1: the sanity baseline SC-03 measures the main model against.
    b0:
      estimator: median_baseline
      feature_set: basic
      params:
        age_bucket_years: 2
    # Ladder step 2: the interpretable depreciation baseline.
    b1:
      estimator: ridge
      feature_set: basic
      params:
        alpha: 1.0
        # Levels below this many training rows share one "rare level" column
        # instead of getting a coefficient each, and an unseen level at serving
        # time is encoded as that column where there is one (EDN-18, EDN-50). An
        # absolute row count rather than a share, so that what it means does not
        # change as the training set grows. Only the `ridge` variant has this: the
        # tree models handle a rare level natively (EDN-02).
        #
        # 5 rather than a larger value, measured on the real snapshot (60,378
        # training rows, MdAPE on the test split): no folding at all gives 503
        # encoded columns and 9.48 %, 5 gives 404 and 9.52 %, 30 gives 294 and
        # 9.71 %, 100 gives 187 and 10.61 %. So folding is not free. What 5 buys
        # for those 0.04 pp is that a level seen in a handful of rows does not get
        # a coefficient fitted on them - 47 of the 100 levels it folds are `model`
        # values seen exactly once. It is not a boundary: an infrequent group
        # already exists at 2, and at 5 only `model` and `fuel_category` have one
        # at all, so the other six categoricals encode an unseen value as all
        # zeros (EDN-50 has the per-column measurement).
        min_category_rows: 5
    # Ladder step 3: the main model.
    lgbm-basic:
      estimator: lightgbm
      feature_set: basic
      params:
        # Not tuned, on evidence rather than by omission: a 12-point grid of these
        # two around their values is flat on the validation split, and no point of
        # it is distinguishable from them (EDN-73,
        # reports/analysis/tuning_sweep_results.txt). A new value goes through the
        # protocol in docs/docs/pipeline.md, "Tuning a hyperparameter".
        learning_rate: 0.05
        num_leaves: 63
        # A ceiling for early stopping, not a tree count: early stopping on the
        # validation split decides how many trees the model keeps (EDN-70). At
        # 1,000 the ceiling decided instead, for both LightGBM variants. With no
        # ceiling in reach, early stopping chooses round 1,243 here and 1,647 for
        # `lgbm-extended` (reports/analysis/early_stopping_ceiling_results.txt,
        # 2026-10-05).
        #
        # 5,000 rather than higher, because the ceiling is also the worst case of
        # every cost that grows with the trees. Measured per tree on the real
        # snapshot, a fit that used all 5,000 would take about 80 s for
        # `lgbm-extended` against NFR-10's 15 minutes, write a booster of about
        # 33 MB, and spend about 105 ms on one row's native SHAP export, which
        # NFR-02 budgets at 200 ms for the whole of `/predict`; at 10,000 that
        # last figure alone would exceed the budget. And rather than 2,000,
        # because `lgbm-extended` ran to round 1,697 and a ceiling 300 rounds
        # above it would bind again after a modest change to the data. 5,000 is
        # three times its best round.
        #
        # `train` warns when the ceiling ends a fit, and `model.json` and the
        # MLflow run record it as `early_stopped`, so a binding ceiling is visible
        # rather than read off a tree count.
        n_estimators: 5000
        early_stopping_rounds: 50
    # Ladder step 4: what the extended features are worth.
    lgbm-extended:
      estimator: lightgbm
      feature_set: extended
      params:
        learning_rate: 0.05
        num_leaves: 63
        # The same ceiling as `lgbm-basic`, for the reasons given there.
        n_estimators: 5000
        early_stopping_rounds: 50

evaluate:
  # Reported for every candidate model (problem-spec section 6). Price buckets
  # are reported too but never enter a criterion, because they condition on the
  # target, which is unknown at prediction time.
  segments:
    - make
    - country_code
    - seller_type
    - fuel_category
    - age_bucket
  # Lower edges in years; the last bucket is open ended. The bucket labels are
  # generated from this list, so moving an edge moves the labels with it.
  age_bucket_edges: [0, 1, 3, 6, 10, 20]
  # Lower edges in EUR, same convention. Reported only: a price bucket conditions
  # on the target, and `evaluate` refuses to gate on one.
  price_bucket_edges: [0, 5000, 10000, 20000, 40000, 80000]
  # The model variant SC-03 compares against.
  baseline_variant: b0
  # The fields specification FR-01 requires of `/predict` (EDN-15). SC-06 masks
  # every *other input field* of the evaluated variant's feature set, on its own
  # and all at once, so this list is what decides which fields the criterion
  # covers. The API reads the same list, so the two cannot disagree about what is
  # optional.
  required_input_fields:
    - make
    - model
    - registration_date
    - mileage_km_raw
    - power_kw
    - fuel_category
    - transmission
    - country_code
    - body_type
    - seller_type
  # The feature column an API input field becomes, where the two differ. FR-01
  # requires `registration_date`; the model consumes the derived `age_years`, so
  # without this line the naive difference against the list above would make
  # `age_years` look optional and SC-06 would mask the most important feature in
  # the model. An equipment field needs no entry: which multi-hot columns it
  # produced is what the training rows decided, so `evaluate` reads that from the
  # vocabulary in the model bundle rather than from here.
  input_field_to_feature:
    registration_date: age_years
  # The partial-input scenario P1 of SC-05 and FR-02, as the exact field list two
  # requirements and one criterion depend on. Everything else is masked.
  sc05_p1_fields:
    - make
    - model
    - registration_date
    - mileage_km_raw
  # SC-01 to SC-06 of problem-spec section 8, as numbers the `evaluate` stage
  # can check. NFR-01 gates deployment on all six, so each one is written to
  # metrics.json with its measured value and a pass or fail.
  success_criteria:
    # SC-01: MdAPE at most 9 %.
    sc01_mdape_max: 0.09
    # SC-02: at least 85 % of predictions within +/-20 %.
    sc02_within_20pct_min: 0.85
    # SC-03: MdAPE at least 30 % below the baseline variant's.
    sc03_mdape_improvement_over_baseline_min: 0.30
    # SC-04: every segment *level* with at least this many test rows stays at or
    # below 15 % MdAPE. The exploratory run already found cars over 20 years at
    # 15.3 %, so this is expected to fail first; that is the point of having it.
    # When no level reaches the minimum, the criterion is reported as not
    # measured, which blocks the gate: "every level satisfies P" is vacuously
    # true over an empty set and a pass would claim a check nobody ran.
    sc04_segment_mdape_max: 0.15
    sc04_min_segment_rows: 500
    # SC-05: the nominal 90 % intervals reach an empirical coverage in this
    # band, for full inputs and for the partial-input scenario P1.
    sc05_coverage_min: 0.88
    sc05_coverage_max: 0.92
    # SC-06: with each optional input masked on its own, and with all of them
    # masked at once, MdAPE stays at or below this multiple of the full-input
    # value. The optional fields are the input fields of the evaluated variant's
    # feature set that FR-01 does not require (EDN-15), so the criterion covers 6
    # fields for a basic variant and 23 for an extended one. What "masked" means
    # per field follows EDN-23: an assertion flag is `False`, an equipment list is
    # empty, everything else is absent.
    sc06_masked_mdape_ratio_max: 1.5
