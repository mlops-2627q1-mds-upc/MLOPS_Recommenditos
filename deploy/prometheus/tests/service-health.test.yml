# Unit tests of ../rules/service-health.yml: for each alert, series that make
# it fire, after its `for` duration, with its labels and annotations, and
# series that must not (`promtool test rules`, run by make prometheus-check and
# CI). Series values: "a+bxn" is a, then n more samples each b larger; "axn"
# repeats a; one sample per `interval`.

rule_files:
- ../rules/service-health.yml
evaluation_interval: 15s
tests:
- name: ApiDown fires after a minute without an answer, not for one failed scrape
  interval: 1m
  input_series:
  - series: up{job="api",instance="api:8000"}
    values: 1 0 0 0
  - series: up{job="node",instance="node-exporter:9100"}
    values: 1 0 1 1
  alert_rule_test:
  - eval_time: 1m
    alertname: ApiDown
    exp_alerts: []
  - eval_time: 2m
    alertname: ApiDown
    exp_alerts:
    - exp_labels:
        severity: critical
        job: api
        instance: api:8000
      exp_annotations:
        summary: The API has not answered Prometheus' scrape for a minute (NFR-05).
        description: The API did not recover within NFR-05's 30 s. Check the container's state and log
          on the VM (`./deploy.sh status`, `docker logs recommenditos-api-1`); if the last deploy broke
          it, roll back with `./deploy.sh rollback`.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#apidown
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-1
# The latency and error shares: series every 15 s, as Prometheus scrapes, since
# the shares are taken over one minute. "a+bxn" with b = 15 is 1 request per
# second, b = 75 is the replay's 5.
- name: PredictLatencyHigh fires when more than 5 % of the valuations take over 250 ms for 5 minutes
  interval: 15s
  input_series:
  - series: http_request_duration_seconds_count{path="/v1/predict",method="POST",status="200"}
    values: 0+15x80
  - series: http_request_duration_seconds_bucket{path="/v1/predict",method="POST",status="200",le="0.25"}
    values: 0+13.5x80
  alert_rule_test:
  - eval_time: 5m
    alertname: PredictLatencyHigh
    exp_alerts: []
  - eval_time: 6m
    alertname: PredictLatencyHigh
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: 'The p95 of /v1/predict is above NFR-02''s 250 ms: 10% of its answers took longer.'
        description: Look at the dashboard for what else uses the one vCPU at the same time (the CPU panel)
          and for a traffic peak. A load test or the replay running is expected to cause it; otherwise
          check the API's CPU and the last deploy, and roll back if it brought the slowdown.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#predictlatencyhigh-and-rangelatencyhigh
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-7
- name: PredictLatencyHigh stays quiet below 5 % slow, and below 20 answers a minute
  interval: 15s
  input_series:
  - series: http_request_duration_seconds_count{path="/v1/predict",method="POST",status="200"}
    values: 0+15x80
  - series: http_request_duration_seconds_bucket{path="/v1/predict",method="POST",status="200",le="0.25"}
    values: 0+14.5x80
  - series: http_request_duration_seconds_count{path="/v1/price-range",method="POST",status="200"}
    values: 0+4x80
  - series: http_request_duration_seconds_bucket{path="/v1/price-range",method="POST",status="200",le="0.3"}
    values: 0+2x80
  alert_rule_test:
  - eval_time: 15m
    alertname: PredictLatencyHigh
    exp_alerts: []
  - eval_time: 15m
    alertname: RangeLatencyHigh
    exp_alerts: []
# A spike of slow answers as a busy vCPU causes one, at the replay's rate: every
# answer slower than 250 ms from 2m to 3m. The share is above 5 % for under
# two minutes, so the alert stays pending and never posts.
- name: PredictLatencyHigh stays quiet through a 1-minute spike at the replay's 5 requests per second
  interval: 15s
  input_series:
  - series: http_request_duration_seconds_count{path="/v1/predict",method="POST",status="200"}
    values: 0+75x80
  - series: http_request_duration_seconds_bucket{path="/v1/predict",method="POST",status="200",le="0.25"}
    values: 0+75x8 600x4 600+75x67
  alert_rule_test:
  - {eval_time: 3m, alertname: PredictLatencyHigh, exp_alerts: []}
  - {eval_time: 4m, alertname: PredictLatencyHigh, exp_alerts: []}
  - {eval_time: 7m30s, alertname: PredictLatencyHigh, exp_alerts: []}
  - {eval_time: 10m, alertname: PredictLatencyHigh, exp_alerts: []}
# Every answer slow from 2m to 8m: the share is above 5 % from 2m15s, so the
# alert fires 5 minutes later, at 7m15s, and resolves once the minute after the
# breach is clean.
- name: PredictLatencyHigh fires 5 minutes 15 s into a 6-minute breach at the replay's rate
  interval: 15s
  input_series:
  - series: http_request_duration_seconds_count{path="/v1/predict",method="POST",status="200"}
    values: 0+75x80
  - series: http_request_duration_seconds_bucket{path="/v1/predict",method="POST",status="200",le="0.25"}
    values: 0+75x8 600x23 675+75x47
  alert_rule_test:
  - {eval_time: 7m, alertname: PredictLatencyHigh, exp_alerts: []}
  - eval_time: 7m15s
    alertname: PredictLatencyHigh
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: 'The p95 of /v1/predict is above NFR-02''s 250 ms: 100% of its answers took longer.'
        description: Look at the dashboard for what else uses the one vCPU at the same time (the CPU panel)
          and for a traffic peak. A load test or the replay running is expected to cause it; otherwise
          check the API's CPU and the last deploy, and roll back if it brought the slowdown.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#predictlatencyhigh-and-rangelatencyhigh
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-7
  - {eval_time: 10m, alertname: PredictLatencyHigh, exp_alerts: []}
- name: RangeLatencyHigh fires per route, against 300 ms
  interval: 15s
  input_series:
  - series: http_request_duration_seconds_count{path="/v1/price-range",method="POST",status="200"}
    values: 0+15x80
  - series: http_request_duration_seconds_bucket{path="/v1/price-range",method="POST",status="200",le="0.3"}
    values: 0+13.5x80
  - series: http_request_duration_seconds_count{path="/v1/comparables",method="POST",status="200"}
    values: 0+15x80
  - series: http_request_duration_seconds_bucket{path="/v1/comparables",method="POST",status="200",le="0.3"}
    values: 0+14.75x80
  alert_rule_test:
  - eval_time: 10m
    alertname: RangeLatencyHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        path: /v1/price-range
      exp_annotations:
        summary: 'The p95 of /v1/price-range is above NFR-02''s 300 ms: 10% of its answers took longer.'
        description: Look at the dashboard for what else uses the one vCPU at the same time (the CPU panel)
          and for a traffic peak. A load test or the replay running is expected to cause it; otherwise
          check the API's CPU and the last deploy, and roll back if it brought the slowdown.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#predictlatencyhigh-and-rangelatencyhigh
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-8
- name: ErrorRateHigh fires above 1 % server errors of the /v1/ answers
  interval: 15s
  input_series:
  - series: http_requests_total{path="/v1/predict",method="POST",status="200"}
    values: 0+14.25x80
  - series: http_requests_total{path="/v1/predict",method="POST",status="500"}
    values: 0+0.75x80
  - series: http_requests_total{path="/v1/predict",method="POST",status="422"}
    values: 0+7.5x80
  alert_rule_test:
  - eval_time: 10m
    alertname: ErrorRateHigh
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: 3.333% of the /v1/ answers are server errors, above NFR-03's 1 %.
        description: Read the API's log for the 5xx answers and their request IDs (`docker logs recommenditos-api-1`).
          If they started with a deploy, roll back with `./deploy.sh rollback`; if the prediction log's
          disk or lock is the cause, see the disk and memory panels.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#errorratehigh
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-9
- name: ErrorRateHigh ignores client errors and the routes outside /v1/
  interval: 15s
  input_series:
  - series: http_requests_total{path="/v1/predict",method="POST",status="200"}
    values: 0+15x80
  - series: http_requests_total{path="/v1/predict",method="POST",status="404"}
    values: 0+7.5x80
  - series: http_requests_total{path="/health",method="POST",status="500"}
    values: 0+3x80
  alert_rule_test:
  - eval_time: 15m
    alertname: ErrorRateHigh
    exp_alerts: []
  - eval_time: 15m
    alertname: ServerErrors
    exp_alerts: []
# Every answer a server error from 2m to 3m at the replay's rate: ErrorRateHigh
# stays quiet, ServerErrors posts its warning (and Alertmanager would hold it
# back only while ErrorRateHigh fires).
- name: ErrorRateHigh stays quiet through a 1-minute burst of server errors at the replay's rate
  interval: 15s
  input_series:
  - series: http_requests_total{path="/v1/predict",method="POST",status="200"}
    values: 0+75x8 600x4 600+75x67
  - series: http_requests_total{path="/v1/predict",method="POST",status="500"}
    values: 0x8 0+75x4 300x67
  alert_rule_test:
  - {eval_time: 3m, alertname: ErrorRateHigh, exp_alerts: []}
  - {eval_time: 4m, alertname: ErrorRateHigh, exp_alerts: []}
  - {eval_time: 7m30s, alertname: ErrorRateHigh, exp_alerts: []}
  - eval_time: 4m
    alertname: ServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: The API answered 300 /v1/ requests with a server error in the last 15 minutes.
        description: Read the API's log for the 5xx answers and their request IDs (`docker logs --since 20m
          recommenditos-api-1`). A healthy API answers none, at any traffic; if they started with a deploy,
          roll back with `./deploy.sh rollback`.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#servererrors
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-9
- name: ErrorRateHigh fires 5 minutes 15 s into a 6-minute breach at the replay's rate
  interval: 15s
  input_series:
  - series: http_requests_total{path="/v1/predict",method="POST",status="200"}
    values: 0+75x8 600x23 675+75x47
  - series: http_requests_total{path="/v1/predict",method="POST",status="500"}
    values: 0x8 75+75x23 1800x48
  alert_rule_test:
  - {eval_time: 7m, alertname: ErrorRateHigh, exp_alerts: []}
  - eval_time: 7m15s
    alertname: ErrorRateHigh
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: 100% of the /v1/ answers are server errors, above NFR-03's 1 %.
        description: Read the API's log for the 5xx answers and their request IDs (`docker logs recommenditos-api-1`).
          If they started with a deploy, roll back with `./deploy.sh rollback`; if the prediction log's
          disk or lock is the cause, see the disk and memory panels.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#errorratehigh
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-9
  - {eval_time: 10m, alertname: ErrorRateHigh, exp_alerts: []}
# A quiet API, 10 requests a minute, every one a server error for 30 minutes:
# below ErrorRateHigh's 20 answers a minute, so only ServerErrors sees it,
# within its first minute. Its
# status 500 series appears with the first error, which `increase` does not
# count.
- name: ServerErrors fires on a quiet API that ErrorRateHigh cannot see
  interval: 15s
  input_series:
  - series: http_requests_total{path="/v1/predict",method="POST",status="500"}
    values: 1+2.5x120
  alert_rule_test:
  - {eval_time: 15s, alertname: ServerErrors, exp_alerts: []}
  - {eval_time: 30m, alertname: ErrorRateHigh, exp_alerts: []}
  - eval_time: 30m
    alertname: ServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: The API answered 150 /v1/ requests with a server error in the last 15 minutes.
        description: Read the API's log for the 5xx answers and their request IDs (`docker logs --since 20m
          recommenditos-api-1`). A healthy API answers none, at any traffic; if they started with a deploy,
          roll back with `./deploy.sh rollback`.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#servererrors
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-9
- name: ServerErrors stays quiet for four server errors in 15 minutes
  interval: 1m
  input_series:
  - series: http_requests_total{path="/v1/predict",method="POST",status="500"}
    values: 0 1 2 3 4x30
  alert_rule_test:
  - {eval_time: 5m, alertname: ServerErrors, exp_alerts: []}
  - {eval_time: 16m, alertname: ServerErrors, exp_alerts: []}
- name: DiskFreeLow fires below NFR-04's 4 GB on the root file system only
  interval: 1m
  input_series:
  - series: node_filesystem_avail_bytes{mountpoint="/",device="/dev/sda1",fstype="ext4"}
    values: 5e9 3e9x10
  - series: node_filesystem_avail_bytes{mountpoint="/boot",device="/dev/sda2",fstype="ext4"}
    values: 1e8x10
  alert_rule_test:
  - eval_time: 5m
    alertname: DiskFreeLow
    exp_alerts: []
  - eval_time: 6m
    alertname: DiskFreeLow
    exp_alerts:
    - exp_labels:
        severity: critical
        mountpoint: /
        device: /dev/sda1
        fstype: ext4
      exp_annotations:
        summary: Only 3GB are free on the host's root file system, below NFR-04's 4 GB floor.
        description: 'Find what grew (`docker system df`, `sudo du -xh -d1 /var/lib/docker`): old image
          tags are removed with `docker image prune`, and Prometheus and the prediction log are capped
          at 2 GB each. Free space before the disk fills, which stops the prediction log and Prometheus.'
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#diskfreelow
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-12
- name: HostMemoryLow fires below 512 MiB available for 5 minutes
  interval: 1m
  input_series:
  - series: node_memory_MemAvailable_bytes
    values: 1e9 4e8x10
  alert_rule_test:
  - eval_time: 5m
    alertname: HostMemoryLow
    exp_alerts: []
  - eval_time: 6m
    alertname: HostMemoryLow
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: Only 381.5MiB of memory are available on the host, below 512 MiB.
        description: See on the dashboard which container grew (the container memory panel) and whether
          a load test, the replay or a CI job on the self-hosted runner is running. A container that keeps
          growing is restarted with `docker restart <container>`; the VM has no swap, so act before the
          kernel kills a process.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#hostmemorylow
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-11
- name: ContainerMemoryNearLimit fires above 90 % of a container's limit, not for one without a limit
  interval: 1m
  input_series:
  - series: container_memory_working_set_bytes{container_label_com_docker_compose_project="recommenditos",container_label_com_docker_compose_service="api",id="/docker/api"}
    values: 7.3e8x10
  - series: container_spec_memory_limit_bytes{container_label_com_docker_compose_project="recommenditos",container_label_com_docker_compose_service="api",id="/docker/api"}
    values: 805306368x10
  - series: container_memory_working_set_bytes{container_label_com_docker_compose_project="recommenditos",container_label_com_docker_compose_service="proxy",id="/docker/proxy"}
    values: 2e7x10
  - series: container_spec_memory_limit_bytes{container_label_com_docker_compose_project="recommenditos",container_label_com_docker_compose_service="proxy",id="/docker/proxy"}
    values: 67108864x10
  - series: container_memory_working_set_bytes{container_label_com_docker_compose_project="recommenditos",container_label_com_docker_compose_service="unlimited",id="/docker/unlimited"}
    values: 5e9x10
  - series: container_spec_memory_limit_bytes{container_label_com_docker_compose_project="recommenditos",container_label_com_docker_compose_service="unlimited",id="/docker/unlimited"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 4m
    alertname: ContainerMemoryNearLimit
    exp_alerts: []
  - eval_time: 6m
    alertname: ContainerMemoryNearLimit
    exp_alerts:
    - exp_labels:
        severity: warning
        container_label_com_docker_compose_project: recommenditos
        container_label_com_docker_compose_service: api
      exp_annotations:
        summary: The api container uses 90.65% of its memory limit.
        description: 'A container at its limit loses its largest process to the kernel. If its memory
          grew steadily, it leaks: restart it (`docker restart recommenditos-api-1`) and open an issue
          with the panel; if it grew with load, its limit in deploy/compose.yaml is too small for that
          load.'
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#containermemorynearlimit
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-15
- name: ContainerRestarting fires on the third restart in 30 minutes, not on one
  interval: 1m
  input_series:
  - series: container_start_time_seconds{container_label_com_docker_compose_project="recommenditos",container_label_com_docker_compose_service="api",id="/docker/api"}
    values: 100 160 220 280x10
  - series: container_start_time_seconds{container_label_com_docker_compose_project="recommenditos",container_label_com_docker_compose_service="proxy",id="/docker/proxy"}
    values: 100 160x10
  alert_rule_test:
  - eval_time: 2m
    alertname: ContainerRestarting
    exp_alerts: []
  - eval_time: 3m
    alertname: ContainerRestarting
    exp_alerts:
    - exp_labels:
        severity: critical
        container_label_com_docker_compose_project: recommenditos
        container_label_com_docker_compose_service: api
      exp_annotations:
        summary: The api container restarted 3 times in 30 minutes.
        description: 'Read the container''s log from before the restarts (`docker logs --since 30m recommenditos-api-1`)
          and its memory panel: at its limit it is killed for memory; a hang shows as the healthcheck''s
          kill (EDN-93). If the restarts began with a deploy, roll back with `./deploy.sh rollback`.'
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#containerrestarting
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-13
- name: TargetDown fires for a monitoring target down for 5 minutes, not for the API
  interval: 1m
  input_series:
  - series: up{job="node",instance="node-exporter:9100"}
    values: 1 0x10
  - series: up{job="api",instance="api:8000"}
    values: 1 0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: TargetDown
    exp_alerts: []
  - eval_time: 6m
    alertname: TargetDown
    exp_alerts:
    - exp_labels:
        severity: warning
        job: node
        instance: node-exporter:9100
      exp_annotations:
        summary: Prometheus has not scraped the node target (node-exporter:9100) for 5 minutes.
        description: Its panels and the alerts built on it see nothing. Check the container (`docker ps
          -a`, `docker logs recommenditos-<service>-1`); it restarts on its own after a crash, so a target
          that stays down needs its log read, and a deploy rolls back when a monitoring service does not
          start.
        runbook_url: https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#targetdown
        dashboard_url: http://localhost:3000/d/service-health/service-health?viewPanel=panel-14
