# Alerts on the model (FR-14, NFR-11): the inputs drifted, the real error grew,
# or the price ranges no longer hold their confidence level, and the job that
# measures them stopped (docs/docs/monitoring.md#model-alerts). Each finding is
# a reason to start FR-15's retraining, which a person starts.
#
# The drift job writes the latest tested window's results into node-exporter's
# textfile collector after every pass, every 15 minutes (EDN-101,
# monitoring/recommenditos_monitoring/textfile.py), so these series hold one
# window's values until the next window is tested. A figure with too few labels
# is left out of the file, so the error and coverage rules cannot fire on it;
# they require `labels_sufficient` as well, so that they stay quiet if a later
# change wrote such a figure anyway.
#
# The error and coverage thresholds are one-sided tests at 0.005 per window,
# NFR-11's false-alarm level for drift, against the model's own test values
# (docs/docs/monitoring.md#why-these-model-thresholds,
# reports/analysis/model_alert_thresholds.py, reports/analysis/market_baseline.py).
# Both depend on the window's labelled count n and are recorded below, so that
# the alerts and the panels of deploy/grafana/dashboards/model-performance.json
# read the same series:
#   - MdAPE: above 1 + 3.55 sqrt(1 / n + 1 / m) times the test MdAPE of the
#     window's countries (#306, EDN-103), n the labelled answers and m the
#     test rows that baseline rests on, a two-sample test, since a market's
#     test MdAPE from a few hundred rows has an error of its own; 3.55 is the
#     smallest constant at or above the 99.5th percentile of
#     (multiple - 1) / sqrt(1 / n + 1 / m) for windows of n answers drawn from
#     each market's, the test mix's, and a 78 % ES mix's test errors of
#     lgbm-basic, at every n from 200 (the fewest the job reports a figure
#     for) to 1,000, with the test values taken as the truth;
#   - coverage: below the nominal level p by more than 2.576 binomial standard
#     errors of the window's labelled ranges, sqrt(p (1 - p) / n), and the
#     continuity correction 0.5 / n.
#
# The annotations are the four that tests/test_monitoring_config.py requires
# (deploy/prometheus/rules/service-health.yml says what each is for). The tests
# are in ../tests/model-performance.test.yml.

groups:
  - name: model-performance
    rules:
      # The ceiling of ModelErrorHigh, as a multiple of the window's baseline
      # MdAPE. A window without `baseline_test_rows`, of a model whose release
      # recorded no test MdAPE per country, has none, so the alert cannot fire.
      - record: recommenditos_performance:mdape_ceiling_multiple
        expr: |
          1 + 3.55 * sqrt(
            1 / recommenditos_performance_labelled_requests
            + 1 / recommenditos_performance_baseline_test_rows
          )

      # The floor of ModelCoverageLow, a share of the labelled ranges.
      - record: recommenditos_performance:coverage_floor
        expr: |
          recommenditos_performance_nominal_level
            - 2.576 * sqrt(
                recommenditos_performance_nominal_level * (1 - recommenditos_performance_nominal_level)
                / recommenditos_performance_labelled_ranges
              )
            - 0.5 / recommenditos_performance_labelled_ranges

      # NFR-11: a feature of the window is below 0.005 / 23 (Bonferroni). The
      # value is the number of drifted features.
      - alert: DriftDetected
        expr: recommenditos_drift_window_drifted_features and recommenditos_drift_window_flagged == 1
        labels:
          severity: warning
        annotations:
          summary: 'Window {{ with query "recommenditos_drift_window_id" }}{{ . | first | value | printf "%.0f" }}{{ end }} of the prediction log drifted in {{ $value | printf "%.0f" }} of 23 input features (NFR-11).'
          description: "Look at the drifted features on the panel and print the finding (`report` in the monitor container): `country_code` alone is a new market mix, several features besides it a population the model has not seen. Check that the data are real, not a client's bug or a replay. If the error or the coverage alert fires too, or the next window drifts as well, start the Retrain workflow (FR-15) with the finding as its reason."
          runbook_url: "https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#driftdetected"
          dashboard_url: "http://localhost:3000/d/model-performance/model-performance?viewPanel=panel-14"

      # FR-14: the window's real MdAPE over its labelled answers, as a multiple
      # of the test MdAPE of its countries. The value is that multiple.
      - alert: ModelErrorHigh
        expr: |
          recommenditos_performance_mdape / recommenditos_performance_baseline_mdape
            > recommenditos_performance:mdape_ceiling_multiple
          and ignoring(figure) recommenditos_performance_labels_sufficient{figure="mdape"} == 1
        labels:
          severity: critical
        annotations:
          summary: 'The real MdAPE of window {{ with query "recommenditos_performance_window_id" }}{{ . | first | value | printf "%.0f" }}{{ end }} is {{ $value | printf "%.3f" }} times the test MdAPE of its countries, above its ceiling of {{ with query "recommenditos_performance:mdape_ceiling_multiple" }}{{ . | first | value | printf "%.3f" }}{{ end }} for {{ with query "recommenditos_performance_labelled_requests" }}{{ . | first | value | printf "%.0f" }}{{ end }} labelled answers (FR-14).'
          description: "The model prices this window's listings worse than its test set did in the same countries, which users notice. Look at the drift panel for which inputs changed, and check that the observed prices (feedback) are real. Then start the Retrain workflow (FR-15) with the finding (`report` in the monitor container) as its reason."
          runbook_url: "https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#modelerrorhigh"
          dashboard_url: "http://localhost:3000/d/model-performance/model-performance?viewPanel=panel-11"

      # FR-14: the share of the window's labelled ranges that hold the observed
      # price, against the level they promise. The value is that share.
      - alert: ModelCoverageLow
        expr: |
          recommenditos_performance_coverage < recommenditos_performance:coverage_floor
          and ignoring(figure) recommenditos_performance_labels_sufficient{figure="coverage"} == 1
        labels:
          severity: critical
        annotations:
          summary: 'Only {{ $value | humanizePercentage }} of the {{ with query "recommenditos_performance_labelled_ranges" }}{{ . | first | value | printf "%.0f" }}{{ end }} labelled price ranges of window {{ with query "recommenditos_performance_window_id" }}{{ . | first | value | printf "%.0f" }}{{ end }} hold the observed price, significantly below their nominal level: the floor at that count is {{ with query "recommenditos_performance:coverage_floor" }}{{ . | first | value | humanizePercentage }}{{ end }} (FR-14).'
          description: "The price ranges promise more than they hold for this window's listings, which users notice. Look at the drift panel for which inputs changed, and check that the observed prices (feedback) are real. Then start the Retrain workflow (FR-15) with the finding (`report` in the monitor container) as its reason; a retrain recalibrates the ranges."
          runbook_url: "https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#modelcoveragelow"
          dashboard_url: "http://localhost:3000/d/model-performance/model-performance?viewPanel=panel-12"

      # The job runs every 15 minutes, so 45 minutes without a pass that
      # succeeded are three missed passes: the panels and the three alerts above
      # then show an old window. 40 minutes held for 5 are those 45 minutes,
      # and the `for` keeps a fresh stack quiet until its first pass has written
      # the series. Inhibited while node-exporter cannot be scraped
      # (TargetDown), which empties the series too.
      - alert: MonitorStale
        expr: |
          time() - recommenditos_monitor_last_success_timestamp_seconds > 40 * 60
          or absent(recommenditos_monitor_last_success_timestamp_seconds)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No pass of the drift, error and coverage job has succeeded for 45 minutes, or its figures have been missing for 5 minutes."
          description: "The model panels and alerts show an old window. Read the monitor's log (`docker logs --since 1h recommenditos-monitor-1`) for `the drift pass failed`, and check that the container runs (`docker ps -a`); a pass by hand (`run-once`) shows the error. Until a pass succeeds, nothing watches the model."
          runbook_url: "https://github.com/mlops-2627q1-mds-upc/MLOPS_Recommenditos/blob/main/docs/docs/monitoring.md#monitorstale"
          dashboard_url: "http://localhost:3000/d/model-performance/model-performance?viewPanel=panel-8"
