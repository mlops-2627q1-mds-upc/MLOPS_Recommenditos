# What Prometheus scrapes inside the stack's Compose network
# (docs/docs/monitoring.md#resource-monitoring). Mounted read-only into the
# prometheus service of ../compose.yaml; it travels with every release in the
# stack image. CI checks it with `promtool check config` (make prometheus-check).
#
# Every target is addressed by its Compose service name, so nothing here needs a
# published port. Retention is set on the command line in compose.yaml, since
# Prometheus takes it from flags only.

global:
  # One sample every 15 s: about 5,800 a day per series, which keeps the TSDB of
  # the four targets at tens of MB a day, far below the 2 GB retention cap.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself: its own memory, the TSDB's size and failed scrapes.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The API's /metrics (FR-11). One target whatever WEB_CONCURRENCY is: in
  # multiprocess mode any worker answers the scrape with the sum of all workers
  # (recommenditos/api/metrics.py). nginx refuses the path from outside.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Per container: CPU, memory against its limit, start time (restarts), block I/O.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # The host: memory, CPU, load, the root file system's free bytes (NFR-04's
  # 4 GB floor) and the .prom files of the textfile collector.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
