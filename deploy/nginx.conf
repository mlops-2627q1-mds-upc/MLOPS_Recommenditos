# The reverse proxy in front of the API (docs/docs/deployment.md, EDN-13, EDN-87).
# Mounted as /etc/nginx/conf.d/default.conf, so this file is included in the
# `http` block of the image's nginx.conf.

# No nginx version in the `Server` header or on error pages.
server_tokens off;

# `request_id` is the API's X-Request-ID response header, which ties a proxy log
# line to the API's own log line for the same request.
log_format api '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
               '$request_time "$http_user_agent" request_id=$upstream_http_x_request_id';

# Docker's DNS, asked again every 10 s: a recreated or restarted API container
# may come back with another address, which a name resolved once at start-up
# would miss until nginx itself restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 8;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log api;

    # Defence in depth beside the API's own 10 KB limit (NFR-09), set above it so
    # that the API's 413 is the answer a client normally sees.
    client_max_body_size 16k;

    # `always`, so that error responses carry them too. No HSTS: there is no TLS
    # (NFR-09, EDN-13).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Internal endpoints, versioned or not: `/feedback` only the replay job may
    # call (FR-10, EDN-13), `/metrics` only Prometheus scrapes. Both reach the API
    # directly at api:8000 inside the Compose network, never through this proxy.
    # nginx matches the normalised path, so `//feedback`, `/v1/./feedback` or a
    # percent-encoded spelling are refused as well.
    location ~* ^/(v[0-9]+/)?(feedback|metrics)(/|$) {
        default_type application/problem+json;
        return 403 '{"type":"about:blank","title":"Forbidden","status":403,"detail":"This endpoint is not reachable from outside the service."}\n';
    }

    location / {
        proxy_pass http://api;
        # The API is one hop away on the same host, where a connect takes well
        # under a millisecond. Without this, a stopped API container holds a
        # client for nginx's default 60 s before the 503 below.
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The errors nginx answers itself have the API's shape, RFC 9457 Problem
    # Details (FR-16, EDN-84), instead of nginx's HTML pages.
    error_page 413 @payload_too_large;
    error_page 502 503 504 =503 @unavailable;

    location @payload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"The request body is larger than the proxy accepts."}\n';
    }

    location @unavailable {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The API is not answering; try again in a few seconds."}\n';
    }
}
