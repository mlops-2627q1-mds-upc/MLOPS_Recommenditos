# The reverse proxy in front of the API (docs/docs/deployment.md, EDN-13, EDN-87).
# Mounted as /etc/nginx/conf.d/default.conf, so this file is included in the
# `http` block of the image's nginx.conf.

# No nginx version in the `Server` header or on error pages.
server_tokens off;

# The request ID of an answer: the API's X-Request-ID when the API answered, and
# nginx's own `$request_id` when nginx answered itself (403, 413, 503), so every
# answer a client gets carries one, and the access log names the same one. The
# second variable is empty for an answer of the API, so the API's header is
# never overwritten.
map $upstream_http_x_request_id $answer_request_id {
    ""      $request_id;
    default $upstream_http_x_request_id;
}
map $upstream_http_x_request_id $own_request_id {
    ""      $request_id;
    default "";
}

# A browser that opens the address names `text/html` in its Accept header, which
# curl, httpx and the web page's own requests do not (the API reads it the same
# way, recommenditos/api/webui.py).
map $http_accept $unavailable_answer {
    default       @unavailable;
    "~*text/html" @unavailable_page;
}

# `request_id` ties a proxy log line to the API's own log lines for the same
# request.
log_format api '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
               '$request_time "$http_user_agent" request_id=$answer_request_id';

# Docker's DNS, asked again every 10 s: a recreated or restarted API container
# may come back with another address, which a name resolved once at start-up
# would miss until nginx itself restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 8;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log api;

    # Defence in depth beside the API's own 10 KB limit (NFR-09), set above it so
    # that the API's 413 is the answer a client normally sees.
    client_max_body_size 16k;

    # `always`, so that error responses carry them too. No HSTS: there is no TLS
    # (NFR-09, EDN-13).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Sent only when nginx answers itself: an empty value sends no header.
    add_header X-Request-ID $own_request_id always;

    # Internal endpoints, versioned or not: `/feedback` only the replay job may
    # call (FR-10, EDN-13), `/metrics` only Prometheus scrapes. Both reach the API
    # directly at api:8000 inside the Compose network, never through this proxy.
    # nginx matches the normalised path, so `//feedback`, `/v1/./feedback` or a
    # percent-encoded spelling are refused as well.
    location ~* ^/(v[0-9]+/)?(feedback|metrics)(/|$) {
        default_type application/problem+json;
        return 403 '{"type":"about:blank","title":"Forbidden","status":403,"detail":"This endpoint is not reachable from outside the service."}\n';
    }

    location / {
        proxy_pass http://api;
        # The API is one hop away on the same host, where a connect takes well
        # under a millisecond. Without this, a stopped API container holds a
        # client for nginx's default 60 s before the 503 below.
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The errors nginx answers itself have the API's shape, RFC 9457 Problem
    # Details (FR-16, EDN-84), instead of nginx's HTML pages.
    error_page 413 @payload_too_large;
    # Where the API is down, as for the few seconds of every deploy, a browser
    # gets a page that says so and tries again by itself (#273); everything
    # else, the web page's own requests and the API's clients, the problem.
    error_page 502 503 504 =503 $unavailable_answer;

    location @payload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"The request body is larger than the proxy accepts."}\n';
    }

    location @unavailable {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The API is not answering; try again in a few seconds."}\n';
    }

    # Static, so that it needs nothing but this file: the API's own web page is
    # down with the API, and so are its fonts, which the page replaces with the
    # system's. Inline, with no request of its own, because a browser that
    # follows the refresh asks nginx again. `add_header` here replaces the
    # server's, so the headers are set again. The quoted text has no single
    # quote, dollar sign or backslash, which nginx would read.
    location @unavailable_page {
        default_type text/html;
        charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Request-ID $own_request_id always;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
        return 503 '<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f3f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<title>Restarting - Recommenditos</title>
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--ground:#f5f3f2;--ink:#1c1c1c;--ink-2:#404040;--rule:#7f806f;--chip:#e7e5e2;--accent:#87f700;--accent-hover:#79e000;--focus:#2563eb;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ground:#1c1c1c;--ink:#f5f3f2;--ink-2:#b8b7b6;--chip:#2e2e2e;--focus:#93c5fd;color-scheme:dark}}
:root[data-theme=dark]{--ground:#1c1c1c;--ink:#f5f3f2;--ink-2:#b8b7b6;--chip:#2e2e2e;--focus:#93c5fd;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/24px system-ui,sans-serif;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
header{border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;height:64px;max-width:1440px;margin:0 auto;padding:0 32px}
.wordmark{font-size:18px;font-weight:500}
main{max-width:1440px;margin:0 auto;padding:64px 32px 96px}
.step{display:inline-block;margin:0 0 16px;padding:7px 8px;border-radius:4px;background:var(--chip);font:500 14px/16px ui-monospace,monospace;letter-spacing:0;text-transform:uppercase}
h1{max-width:560px;margin:0;text-wrap:balance;font-size:40px;font-weight:500;line-height:48px;letter-spacing:-.04em}
p.lede{max-width:416px;margin:8px 0 0;color:var(--ink-2);text-wrap:pretty}
.retry{display:inline-block;margin-top:32px;padding:11px 18px;border-radius:8px;background:var(--accent);color:#1c1c1c;font:500 16px/20px ui-monospace,monospace;text-transform:uppercase;text-decoration:none}
.retry:hover{background:var(--accent-hover)}
.retry:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media(max-width:600px){.bar,main{padding-left:16px;padding-right:16px}main{padding-top:40px}h1{font-size:32px;line-height:40px}}
</style>
</head>
<body>
<header><div class="bar"><span class="wordmark">Recommenditos</span></div></header>
<main>
<p class="step">Status 503</p>
<h1>The price service is restarting</h1>
<p class="lede">It is back in a few seconds. This page tries again by itself every 5 seconds, or you can try now.</p>
<a class="retry" href="">Try again</a>
</main>
</body>
</html>
';
    }
}
