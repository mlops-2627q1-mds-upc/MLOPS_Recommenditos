# The serving stack: the API behind nginx (docs/docs/deployment.md, EDN-87).
#
# Locally, from the repository root after `dvc pull`:
#     docker compose -f deploy/compose.yaml up -d --build --wait     (make stack)
# On the VM, from the deploy user's home, where this file, nginx.conf and .env sit
# and the image was loaded beforehand:
#     docker compose up -d --wait
#
# Values come from `.env` beside this file (template: .env.template); without
# one, the local defaults below apply.

name: recommenditos

# Docker keeps a container's log in json-file without a limit by default. Each
# service keeps at most 5 files of 10 MB, 100 MB in all, of the VM's 20 GB
# (NFR-04): the API's healthcheck alone writes about 3.5 MB a day, and each
# service's 50 MB hold about 120,000 requests of history.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: recommenditos-api:${API_IMAGE_TAG:-local}
    build:
      context: ..
    # No `ports`: the API is reachable only inside this network, through nginx or
    # from a sibling service such as the replay job (FR-10, EDN-13).
    expose:
      - "8000"
    # The workers' metric files (PROMETHEUS_MULTIPROC_DIR in the image), in memory
    # rather than on the container's writable layer. Prometheus scrapes
    # api:8000/metrics from inside this network; nginx refuses the path.
    # Owned by the service user explicitly: without the options, Docker remounts
    # it as root's 0755 when the container restarts, and the API then cannot
    # start again after a crash.
    tmpfs:
      - /tmp/prometheus:uid=10001,gid=10001,mode=0700
    restart: unless-stopped
    logging: *logging
    environment:
      # FR-10's key for /v1/feedback, from `.env` beside this file. Empty, the
      # endpoint refuses every request and the rest of the API works (NFR-15).
      RECOMMENDITOS_API_KEY: ${RECOMMENDITOS_API_KEY:-}
    volumes:
      # The prediction log and the feedback, one SQLite file (EDN-86). A named
      # volume, so it survives a new image and M6's drift job can mount it.
      - prediction-log:/var/lib/recommenditos
    # The test is the image's HEALTHCHECK (urllib against /health). Probed every
    # second while the API starts, so nginx and `--wait` see it healthy as soon as
    # it is, then every 10 s (NFR-05).
    healthcheck:
      interval: 10s
      timeout: 3s
      start_period: 60s
      start_interval: 1s
      retries: 3

  proxy:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    depends_on:
      api:
        condition: service_healthy
    # The only published port: 8080 locally, HTTP_PORT (80) on the VM. nginx
    # itself listens on 8080 as a non-root user inside the container.
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging: *logging

volumes:
  prediction-log:
