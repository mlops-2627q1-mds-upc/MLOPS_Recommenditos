# The serving stack: the API behind nginx (docs/docs/deployment.md, EDN-87).
#
# Locally, from the repository root after `dvc pull`:
#     docker compose -f deploy/compose.yaml up -d --build --wait     (make stack)
# On the VM, from the deploy user's home, where this file, nginx.conf and .env sit
# and the image was loaded beforehand:
#     docker compose up -d --wait
#
# Values come from `.env` beside this file (template: .env.template); without
# one, the local defaults below apply.

name: recommenditos

services:
  api:
    image: recommenditos-api:${API_IMAGE_TAG:-local}
    build:
      context: ..
    # No `ports`: the API is reachable only inside this network, through nginx or
    # from a sibling service such as the replay job (FR-10, EDN-13).
    expose:
      - "8000"
    restart: unless-stopped
    # The test is the image's HEALTHCHECK (urllib against /health). Probed every
    # second while the API starts, so nginx and `--wait` see it healthy as soon as
    # it is, then every 10 s (NFR-05).
    healthcheck:
      interval: 10s
      timeout: 3s
      start_period: 60s
      start_interval: 1s
      retries: 3

  proxy:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    depends_on:
      api:
        condition: service_healthy
    # The only published port: 8080 locally, HTTP_PORT (80) on the VM. nginx
    # itself listens on 8080 as a non-root user inside the container.
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
