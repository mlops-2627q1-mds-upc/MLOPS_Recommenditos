# The serving stack: the API behind nginx (docs/docs/deployment.md, EDN-87), and
# the resource monitoring and the drift job beside it (docs/docs/monitoring.md,
# EDN-99, EDN-101).
#
# Locally, from the repository root after `dvc pull`:
#     docker compose -f deploy/compose.yaml up -d --build --wait     (make stack)
# On the VM, this file and everything beside it in deploy/ travel with every
# release in the stack image (deploy/stack.Dockerfile): deploy.sh copies them
# into /opt/recommenditos/stacks/<hash>/, behind the link `stack`, and starts
# them with /opt/recommenditos/.env (docs/docs/deployment.md#the-stack-files-on-the-vm).
# By hand, from /opt/recommenditos, with the same paths as deploy.sh:
#     ./deploy.sh deploy <the tag that runs>
#     docker compose -f "$(readlink -f stack)/compose.yaml" --env-file .env up -d --wait
#
# Values come from `.env`, on the VM the one in /opt/recommenditos (template:
# .env.template). Two have no default, Grafana's admin password and the Discord
# webhook of the alerts, so a stack without them does not start; `make stack`
# sets throwaway ones for a local stack, and CI generates its own.

name: recommenditos

# Docker keeps a container's log in json-file without a limit by default. Each
# service keeps at most 5 files of 10 MB, 400 MB for the eight services, of the
# VM's 20 GB (NFR-04): the API's healthcheck alone, probing every 5 s, writes about 7 MB a
# day, so the API's 50 MB hold about a week of it, and each service's 50 MB
# hold about 120,000 requests of history.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The hardening every service shares (NFR-09, #200). The root file system is
# read-only, so a service writes only to the tmpfs mounts and the volumes listed
# under it; every Linux capability is dropped, since none binds a port below
# 1024, changes a file's owner or switches user; and `no-new-privileges` keeps a
# setuid binary in an image from raising a process's privileges. Every service
# runs with no capability at all. The one exception is cAdvisor's user, root
# (see there). The API needed one writable path more than before, a tmpfs on
# /tmp (see there). tests/integration/test_deployed_container.py checks this
# for every service of this file.
x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Memory and process limits keep one leaking service from starving the others on
# the VM's 4 GB, which M6's monitoring shares (NFR-04). `memswap_limit` equal to
# `mem_limit` allows no swap: in a container over its limit, the kernel kills
# the largest process rather than letting the VM swap. With several workers that
# is usually a worker, which the server's master (uvicorn's supervisor, nginx's
# master) replaces; when the main process dies, Docker restarts the container
# (`restart: unless-stopped`, NFR-05). A tmpfs is memory and counts against its
# container's limit. On the FIB VM (cgroup v1 without swapaccount=1) Docker
# warns "No swap limit support" and does not enforce memswap_limit; the VM has
# no swap, so that has no effect today.

services:
  api:
    <<: *hardening
    image: ${API_IMAGE:-recommenditos-api}:${API_IMAGE_TAG:-local}
    build:
      context: ..
    # No `ports`: the API is reachable only inside this network, through nginx or
    # from a sibling service such as the replay job (FR-10, EDN-13).
    expose:
      - "8000"
    # The two writable paths besides the prediction-log volume, both in memory.
    # /tmp/prometheus holds the workers' metric files (PROMETHEUS_MULTIPROC_DIR in
    # the image), 88 KB with two workers after a load test; Prometheus scrapes
    # api:8000/metrics from inside this network, and nginx refuses the path.
    # /tmp is where SQLite spills a sort or index too large for its cache and
    # where Python's `tempfile` writes: with the root read-only and no /tmp, a
    # spilling query of the prediction log fails with "disk I/O error" (#200).
    # Owned by the service user explicitly: without `uid` and `gid` a tmpfs is
    # root's, and the API cannot write it (with mode 0700 it does not even start).
    # The recovery test checks owner and mode after a restart.
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=64m
      - /tmp/prometheus:uid=10001,gid=10001,mode=0700,size=16m
    restart: unless-stopped
    # Docker's init (tini) as PID 1, with the server as its child. The healthcheck
    # can then kill a hung server, and the container exits; the kernel ignores
    # that kill when the server itself is PID 1 (EDN-93).
    init: true
    logging: *logging
    environment:
      # FR-10's key for /v1/feedback, from the stack's `.env`. Empty, the
      # endpoint refuses every request and the rest of the API works (NFR-15).
      RECOMMENDITOS_API_KEY: ${RECOMMENDITOS_API_KEY:-}
      # The number of uvicorn worker processes; the load test runs with 2 to
      # check NFR-03's exactly-once logging (docs/docs/load-testing.md).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    # NFR-04 caps the API at 1 GB. 768 MiB is 1.2 to 1.3 times the most it used in
    # four laptop load tests of 2026-10-22 (#200), two workers at 20 requests/s for
    # 60 s, with and without these limits: 606 MiB in `docker stats` (the dry run
    # in reports/loadtest/ measured 566 MiB), and 634 MiB in the cgroup's
    # `memory.peak`, which includes the start-up and reclaimable page cache. One
    # worker, the default, holds 248 MiB idle against two workers' 539 MiB
    # (docs/docs/deployment.md). On the VM at 20 requests/s for 5 minutes (#143)
    # the API peaked at 295 MiB with one worker and 609 MiB with two, so the limit
    # stays (EDN-88).
    mem_limit: 768m
    memswap_limit: 768m
    # Processes and threads: 33 at most in the same load tests (`pids.peak`). Each worker can
    # hold its event loop, up to 40 threads of the pool that runs the routes, the
    # scoring thread and the log's pruning thread, about 45, so 256 leaves room
    # for four workers and still stops a thread leak like #179's, 137 to 345
    # threads per worker, before it exhausts the VM.
    pids_limit: 256
    volumes:
      # The prediction log and the feedback, one SQLite file (EDN-86). A named
      # volume, so it survives a new image and M6's drift job can mount it.
      - prediction-log:/var/lib/recommenditos
    # The test is the image's HEALTHCHECK (recommenditos/api/healthcheck.py).
    # Probed every second while the API starts, so nginx and `--wait` see it
    # healthy as soon as it is, then every 5 s. Once the API has answered, or
    # after the start period, a probe that gets no answer in two attempts of 6 s
    # ends the hung server, which comes back within NFR-05's 30 s (EDN-93); the
    # timeout leaves room for both attempts.
    healthcheck:
      interval: 5s
      timeout: 15s
      start_period: 60s
      start_interval: 1s
      retries: 3

  proxy:
    <<: *hardening
    # Pinned by digest as well as by tag, which Dependabot moves together (NFR-09).
    # The slim variant: nginx with its core modules only, without the optional
    # modules (image filter, XSLT, GeoIP, njs) and the libraries they pull in,
    # such as fontconfig and libexpat, none of which a proxy uses.
    image: nginxinc/nginx-unprivileged:1.30-alpine-slim@sha256:5d8bb9437d74a600ec5dbf90c035451c724dc33eac8d3a71078f6f8612c345f6
    depends_on:
      api:
        condition: service_healthy
    # The only port published to the network: HTTP_PORT, 8080 locally and on the
    # VM; Grafana's is on the host's loopback only. nginx itself listens on 8080
    # as a non-root user inside the container.
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # The unprivileged image writes nothing but /tmp: its pid file and the
    # temporary files of request and response bodies too large for nginx's
    # buffers. Owned by its user, 101, for the same reason as the API's tmpfs.
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700,size=16m
    # 20 MB and 15 processes at most in the same load tests, with one worker per
    # CPU of the laptop's eight (`worker_processes auto`): 64 MiB and 64
    # processes leave room for a larger host.
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

  # Resource monitoring (docs/docs/monitoring.md#resource-monitoring, EDN-99):
  # Prometheus scrapes the API, cAdvisor (per container) and node-exporter (the
  # host) every 15 s; Alertmanager and Grafana below. All always run, with no
  # Compose profile, so CI, a laptop and the VM start the same stack. None
  # publishes a port to the network, Grafana only one on the host's loopback:
  # the VM's 8080 to 8089 are public through the NAT. A service that does not become
  # healthy fails `up --wait`, and with it a deploy, which then rolls the API
  # back too (deploy.sh), so their healthchecks probe only that they serve.
  prometheus:
    <<: *hardening
    # Pinned by digest as well as by tag, which Dependabot moves together.
    image: quay.io/prometheus/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    # The image's own two flags, which a `command` replaces, and the retention:
    # at most 2 GB of the VM's 20 GB disk (NFR-04), and at most 60 days, the
    # rest of the term with room to spare. The size counts the TSDB's blocks and
    # its write-ahead log; the oldest block goes first.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=2GB
      - --storage.tsdb.retention.time=60d
    expose:
      - "9090"
    volumes:
      # A relative bind mount, so the files travel with the release (deploy.sh):
      # prometheus.yml, the alerting rules in rules/ and their tests in tests/.
      - ./prometheus:/etc/prometheus:ro
      # The TSDB in a named volume: it survives a new image and a changed
      # configuration, which recreates the container (docs/docs/deployment.md).
      - prometheus-data:/prometheus
    # The image runs as `nobody`; Prometheus 3 sets Go's memory limit to 90 % of
    # the container's, so it collects garbage harder before the kernel kills it.
    # 384 MiB is about twice the 200 MiB peak estimated for a few weeks of
    # retention of the four targets (docs/docs/deployment.md).
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    # busybox `wget` is in the image. /-/ready answers 200 once the TSDB is
    # open; replaying a long write-ahead log after a restart can take a while on
    # the VM's one vCPU, hence the start period.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 1s
      retries: 3

  # Per container: CPU, memory against its limit, the start time (a changed one
  # is a restart) and block I/O. For the cgroup v1 of the VM as well as the cgroup v2
  # of CI and laptops.
  #
  # The exception to the shared hardening: cAdvisor runs as root, because only
  # root can read the Docker socket and /var/lib/docker, and the socket is
  # root-equivalent on the host (whoever can talk to it can start a privileged
  # container), however read-only its mount. It still drops every capability,
  # has a read-only root and `no-new-privileges`, and it publishes no port.
  cadvisor:
    <<: *hardening
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command:
      # Only Docker's containers and the root cgroup, not every cgroup of the host.
      - --docker_only=true
      # Stats every 30 s rather than every second: cAdvisor's own CPU on a
      # one-vCPU host. Prometheus' 15 s scrape then reads each value twice.
      - --housekeeping_interval=30s
      # The collectors the dashboards and alerts read; the rest, the per-container
      # disk usage above all, which walks every layer's files, stays off. So does
      # `network`: cAdvisor reads a container's traffic from the host's /proc,
      # which it would need under /rootfs with /var/lib/docker, a wider root
      # exception that no requirement asks for; the API counts its own requests.
      - --enable_metrics=cpu,memory,diskIO
      # Labels only for the Compose service and project, not every image label,
      # so that a series is named by its service, as `container_label_com_docker_compose_service`.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    # The image's healthcheck (/usr/bin/healthcheck.sh, `wget` on /healthz),
    # probed every second while it starts, so that `--wait` returns sooner.
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s
      retries: 3

  # The host: memory, CPU, load and the root file system's free bytes against
  # NFR-04's 4 GB floor. It reads the host's / under /host, read-only; without
  # host networking, which would open its port 9100 on the VM, and without the
  # host's PID namespace, which none of its figures needs. Its network figures
  # are therefore its own container's, not the host's.
  node-exporter:
    <<: *hardening
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.rootfs=/host
      # The textfile collector: every *.prom file in this directory becomes
      # metrics, which is how M6's drift job publishes its results (the
      # `monitor` service below). The job writes the volume; node-exporter
      # only reads it.
      - --collector.textfile.directory=/var/lib/node-exporter/textfile
    expose:
      - "9100"
    volumes:
      # `rslave`: a file system the host mounts later shows up here too.
      - /:/host:ro,rslave
      - monitor-textfile:/var/lib/node-exporter/textfile:ro
    # The image runs as `nobody`.
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    logging: *logging
    # busybox `wget` on the landing page, which collects nothing.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s
      retries: 3

  # Alertmanager: takes the alerts that fire in Prometheus (prometheus/rules/)
  # and posts them to the team's Discord through a webhook
  # (docs/docs/monitoring.md#alerts, EDN-99). No published port.
  alertmanager:
    <<: *hardening
    # Pinned by digest as well as by tag, which Dependabot moves together.
    image: quay.io/prometheus/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    # The webhook URL is a secret, and Alertmanager reads it only from its
    # configuration or a file (`webhook_url_file`). The image's busybox shell
    # writes it from the environment to a file on the tmpfs below, readable by
    # the service user alone, and starts Alertmanager without it in its
    # environment. A Compose secret from the environment would keep it out of
    # `docker inspect` too, but Compose refuses those for a read-only container.
    # No cluster: one Alertmanager, so it opens no gossip port.
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf '%s' "$$DISCORD_WEBHOOK_URL" > /run/alertmanager/discord-webhook-url
        exec env -u DISCORD_WEBHOOK_URL /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --cluster.listen-address= \
          --web.external-url=http://localhost:9093/
    environment:
      # The team channel's webhook (Discord, channel settings, Integrations,
      # Webhooks), from the stack's `.env`. No default: without it a stack
      # would drop every alert, so Compose refuses to start one (NFR-15).
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?set DISCORD_WEBHOOK_URL in the stack's .env, see deploy/.env.template}
    expose:
      - "9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # Silences and which notifications went out, so a new release does not
      # post the alerts that fire again.
      - alertmanager-data:/alertmanager
    # The webhook file, in memory, owned by the image's user `nobody`.
    tmpfs:
      - /run/alertmanager:uid=65534,gid=65534,mode=0700,size=1m
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s
      retries: 3

  # Grafana: the provisioned dashboard of the figures above against their
  # limits (docs/docs/monitoring.md#grafana, EDN-99). The one service besides
  # nginx with a published port, and only on the host's loopback: on the VM it
  # is reached through an SSH tunnel, never through the NAT's public ports.
  # Anonymous visitors are Viewers, which is safe only because nothing but the
  # tunnel reaches it; the admin logs in with the password from `.env`.
  grafana:
    <<: *hardening
    # Pinned by digest as well as by tag, which Dependabot moves together. Not
    # the `-slim` variant, which leaves out the Prometheus data source.
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    depends_on:
      - prometheus
    # 127.0.0.1 only. GRAFANA_PORT moves it for a second stack on the same
    # host, as the rollback drill of the integration suite runs one.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      # No default and no committed value (NFR-15): Compose refuses to start
      # without it. Grafana sets it when it creates its database, on the first
      # start; a later change needs `grafana cli admin reset-admin-password`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the stack's .env, see deploy/.env.template}
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}/
      # Read-only for whoever reaches it, which is whoever has the tunnel.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/service-health.json
      # The alerts are Prometheus' rules and Alertmanager's (EDN-99), not Grafana's.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      # Nothing leaves the stack: no usage reports, update checks, news feed,
      # avatars or plugin downloads at start-up.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # The data sources the image bundles besides Prometheus, each a process of
      # its own once started: off, they neither start nor take memory and
      # process slots (with them, Grafana ran into the 128 processes below), and
      # their findings in .trivyignore stay in code that never runs.
      GF_PLUGINS_DISABLE_PLUGINS: cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
      # Its log to Docker's, not to a file in the read-only image.
      GF_LOG_MODE: console
      # Go collects garbage harder as the heap nears this, before the kernel
      # kills Grafana at the container's limit below.
      GOMEMLIMIT: 400MiB
    volumes:
      # The data source and the dashboard provider, then the dashboards.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Grafana's SQLite database: users and sessions, since every data source
      # and dashboard is provisioned.
      - grafana-data:/var/lib/grafana
    # The image runs as `grafana` (472).
    tmpfs:
      - /tmp:uid=472,gid=0,mode=0700,size=16m
    # Grafana alone held 171 MiB of its own memory after starting, 369 MiB at
    # its peak with the page cache, and 30 processes at most, on a laptop on
    # 2026-11-04: 512 MiB and 128 processes.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    # The image's busybox `wget` on /api/health, which answers once the
    # database is open; it does not need Prometheus.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 1s
      retries: 3

  # M6's drift job (#228, EDN-101): every 15 minutes, one pass of
  # `run-once`, which tests each window of 1,000 requests the prediction log
  # completed for input drift against the training reference with Alibi
  # Detect, stores the results in monitor.db and writes the latest window's for
  # node-exporter (docs/docs/monitoring.md#drift-job). The Python process ends
  # after each pass, so between passes only the shell and its `sleep` run. A
  # pass that fails prints why to the service log and the loop goes on; the
  # job's last-success metric shows it. No healthcheck at all: Compose 2.35
  # fails `up --wait` on `disable: true`, and with none `--wait` waits only for
  # the container to run, so a failing pass can never fail a deploy. Always on,
  # no profile, so it ships and rolls back with every release.
  monitor:
    <<: *hardening
    # The image of the replay below.
    image: ${MONITORING_IMAGE:-recommenditos-monitoring}:${API_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    # The API's user, not the image's: the job reads the API's SQLite file in
    # WAL mode, which needs its directory writable for the shared-memory file
    # even to read (docs/docs/api.md#the-records), and the API's volume is the
    # API user's. The job opens the log read-only all the same.
    user: "10001:10001"
    entrypoint:
      - sh
      - -c
      - |
        while :; do
          python -m recommenditos_monitoring run-once
          sleep "$$RECOMMENDITOS_MONITOR_INTERVAL_S"
        done
    depends_on:
      api:
        condition: service_healthy
    environment:
      RECOMMENDITOS_PREDICTION_LOG: /var/lib/recommenditos/prediction-log.sqlite3
      RECOMMENDITOS_MONITOR_DB: /var/lib/recommenditos-monitor/monitor.db
      RECOMMENDITOS_MONITOR_TEXTFILE_DIR: /var/lib/node-exporter/textfile
      # Seconds between the end of one pass and the start of the next.
      RECOMMENDITOS_MONITOR_INTERVAL_S: ${RECOMMENDITOS_MONITOR_INTERVAL_S:-900}
    volumes:
      # The API's volume, read-write for WAL's shared-memory file (see `user`).
      - prediction-log:/var/lib/recommenditos
      # monitor.db: the windows and their results, the evidence for the report.
      - monitor-results:/var/lib/recommenditos-monitor
      - monitor-textfile:/var/lib/node-exporter/textfile
    # Where Matplotlib and Numba, which Alibi Detect imports, keep their caches;
    # the root is read-only. The user's, like the API's.
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=64m
    # Docker's init (tini) as PID 1 in front of the shell, so a stop's SIGTERM
    # ends the shell's loop at once instead of after the 10 s grace.
    init: true
    restart: unless-stopped
    # Passes that tested three windows peaked at 197 MiB in the cgroup's
    # memory.peak on a laptop (docs/docs/monitoring.md#drift-job); between
    # passes init, shell and sleep hold about 4 MiB. Half a vCPU at most, so that
    # a pass on the VM's one vCPU leaves the API's latency (NFR-02) half of it.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 64
    logging: *logging

  # M6's replay of held-out listings (#227, EDN-100): control listings, then the
  # ES market, sent through nginx like a client's, with each listing's observed
  # price sent to /v1/feedback inside this network. Behind a profile, so `up`,
  # and with it every deploy, neither starts nor removes it; it runs by hand,
  # to its end (docs/docs/monitoring.md#replay):
  #     docker compose -f deploy/compose.yaml --profile replay run --rm replay \
  #         --control 5000 --then es --rate 5
  replay:
    <<: *hardening
    profiles: [replay]
    # The monitoring image of the same release (monitoring/Dockerfile), with the
    # samples of `dvc pull monitoring_samples` baked in. On the VM .env names
    # CD's repository in MONITORING_IMAGE; locally Compose builds it.
    image: ${MONITORING_IMAGE:-recommenditos-monitoring}:${API_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    entrypoint: ["python", "-m", "recommenditos_monitoring", "replay"]
    depends_on:
      api:
        condition: service_healthy
      proxy:
        condition: service_started
    environment:
      # The key /v1/feedback requires, the API's own from the same `.env`.
      RECOMMENDITOS_API_KEY: ${RECOMMENDITOS_API_KEY:-}
    # Python's own signal handling as a child of tini, so Ctrl+C stops the run
    # with its summary.
    init: true
    # The design's budget for the replay (docs/docs/monitoring.md): it streams
    # the samples a listing at a time and holds only the counts.
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32
    logging: *logging

volumes:
  prediction-log:
  # Prometheus' TSDB, at most 2 GB by its retention.
  prometheus-data:
  # Alertmanager's silences and notification log.
  alertmanager-data:
  # Grafana's database.
  grafana-data:
  # The drift job's monitor.db, which survives a new image and a rollback.
  monitor-results:
  # The textfile collector's .prom files (node-exporter above), which the drift
  # job rewrites after every pass. In memory, mounted by Docker with the job's
  # user as its owner whichever container mounts it first: on disk the volume
  # would be root's, which node-exporter's image gives it, and the job, not
  # root, could not write it. A reboot empties it until the next pass.
  monitor-textfile:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=10001,gid=10001,mode=0755,size=1m"
